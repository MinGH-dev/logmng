# Local stack from dist offline bundle (see docs/requirements/20260413-docker-local-dist-multidb.md).
# Prerequisite: ./scripts/build-offline-bundle.sh  →  dist/logmng-offline-<VERSION>/
# From repo root (use `docker compose` if your Docker CLI includes the Compose V2 plugin; else `docker-compose`):
#   cp .env.docker.example .env.docker   # edit secrets
#   docker-compose -f docker/docker-compose.yml --project-directory . up -d postgres
#   docker-compose -f docker/docker-compose.yml --project-directory . --profile init run --rm db-init
#   docker-compose -f docker/docker-compose.yml --project-directory . up -d --build backend frontend
#
# TC-08 (mvn test in EL 9.6 + JDK 17):
#   docker-compose -f docker/docker-compose.yml --project-directory . --profile mvn-test build mvn-test
#   docker-compose -f docker/docker-compose.yml --project-directory . --profile mvn-test run --rm mvn-test

name: logmng-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # Override via shell or repo-root `.env` (compose interpolation); align with `.env.docker`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - logmng-net

  db-init:
    profiles: ["init"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Override via shell or repo-root `.env` (compose interpolation); align with `.env.docker`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SUPERUSER: postgres
      DB_A_NAME: logmng
      DB_PB_NAME: pbfep
      DB_B_NAME: imagelog
      INSTALL_NONINTERACTIVE: "1"
      SETUP_NONINTERACTIVE: "1"
      SETUP_MODE: full
    volumes:
      - ${OFFLINE_ROOT:-./dist/logmng-offline-1.0.1}/db:/db:ro
      - ./docker/db-init-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - logmng-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        DIST_VERSION: ${DIST_VERSION:-1.0.1}
        BACKEND_JAR: ${BACKEND_JAR:-logmng-backend-1.0.1.jar}
    env_file:
      - .env.docker
    environment:
      SERVER_PORT: "9200"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logmng-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        DIST_VERSION: ${DIST_VERSION:-1.0.1}
        STATIC_SERVER_JAR: ${STATIC_SERVER_JAR:-logmng-static-server-1.0.0.jar}
    environment:
      PORT: "3001"
      # Browser on host loads UI at localhost:3001 — API base must be host-reachable.
      LOGMNG_API_BASE_URL: ${LOGMNG_API_BASE_URL:-http://localhost:9200/api}
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - logmng-net

  mvn-test:
    profiles: ["mvn-test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mvn-test
    volumes:
      - ./backend:/work/backend
    working_dir: /work/backend
    command: ["mvn", "-q", "test"]
    networks:
      - logmng-net

volumes:
  pgdata:

networks:
  logmng-net:
    name: logmng-local-net
