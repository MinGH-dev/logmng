# Local stack from dist offline bundle (see docs/requirements/20260413-docker-local-dist-multidb.md).
# Three separate Postgres services simulate three remote hosts (Primary / PB / ImageLog); see docker/README.md.
# Prerequisite: ./scripts/build-offline-bundle.sh  →  dist/logmng-offline-<VERSION>/
# From repo root (use `docker compose` if your Docker CLI includes the Compose V2 plugin; else `docker-compose`):
#   cp .env.docker.example .env.docker   # edit secrets
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . up -d postgres postgres-pb postgres-imagelog
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . --profile init run --rm db-init
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . up -d --build backend frontend
#
# TC-08 (mvn test in EL 9.6 + JDK 17):
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . --profile mvn-test build mvn-test
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . --profile mvn-test run --rm mvn-test
#
# Frontend tests (Node 20 + npm ci / npm test):
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . --profile npm-test build npm-test
#   docker-compose --env-file .env.docker -f docker/docker-compose.yml --project-directory . --profile npm-test run --rm npm-test

name: logmng-local

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  # Override via shell or repo-root `.env` (compose interpolation); align with `.env.docker`.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  POSTGRES_DB: postgres

services:
  # Primary cluster (system DB: logmng / DB_A_NAME)
  postgres:
    image: postgres:16
    environment: *postgres-env
    ports:
      # Default host port 5433 avoids clashing with a local PostgreSQL on 5432; override via POSTGRES_PUBLISH_PORT in .env.docker.
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - logmng-net

  # PB FEP cluster (database pbfep) — separate host simulation
  postgres-pb:
    image: postgres:16
    environment: *postgres-env
    ports:
      - "${POSTGRES_PB_PUBLISH_PORT:-5434}:5432"
    volumes:
      - pgdata_pb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - logmng-net

  # ImageLog cluster (database imagelog) — separate host simulation
  postgres-imagelog:
    image: postgres:16
    environment: *postgres-env
    ports:
      - "${POSTGRES_IMAGELOG_PUBLISH_PORT:-5435}:5432"
    volumes:
      - pgdata_imagelog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - logmng-net

  db-init:
    profiles: ["init"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
      postgres-pb:
        condition: service_healthy
      postgres-imagelog:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Override via shell or repo-root `.env` (compose interpolation); align with `.env.docker`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SUPERUSER: postgres
      DB_PB_HOST: postgres-pb
      DB_PB_PORT: "5432"
      DB_PB_SUPERUSER: postgres
      DB_B_HOST: postgres-imagelog
      DB_B_PORT: "5432"
      DB_B_SUPERUSER: postgres
      DB_A_NAME: logmng
      DB_PB_NAME: pbfep
      DB_B_NAME: imagelog
      INSTALL_NONINTERACTIVE: "1"
      SETUP_NONINTERACTIVE: "1"
      SETUP_MODE: full
      # Default seed matches UNIQUE(user_id) on app_user_permission_group (one group row per user).
      # Full dev seed init-data.sql expects multiple groups per user and fails; use closed-network minimal or set INIT_DATA_FILE / SKIP_INIT_DATA in .env.docker.
      INIT_DATA_FILE: ${INIT_DATA_FILE:-init-data-closed-network-admin-only.sql}
      CLOSED_NETWORK_MINIMAL: ${CLOSED_NETWORK_MINIMAL:-1}
      # Default 1 for local compose: apply decrypt-practice seeds when unset in env file (override in .env.docker).
      LOAD_LOCAL_DECRYPT_TEST_DATA: ${LOAD_LOCAL_DECRYPT_TEST_DATA:-1}
    volumes:
      - ${OFFLINE_ROOT:-./dist/logmng-offline-1.0.2}/db:/db:ro
      - ./docker/db-init-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - logmng-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        DIST_VERSION: ${DIST_VERSION:-1.0.2}
        BACKEND_JAR: ${BACKEND_JAR:-logmng-backend-1.0.2.jar}
    env_file:
      - .env.docker
    environment:
      SERVER_PORT: "9200"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-pb:
        condition: service_healthy
      postgres-imagelog:
        condition: service_healthy
    networks:
      - logmng-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        DIST_VERSION: ${DIST_VERSION:-1.0.2}
        STATIC_SERVER_JAR: ${STATIC_SERVER_JAR:-logmng-static-server-1.0.0.jar}
    environment:
      PORT: "3001"
      # Browser on host loads UI at localhost:3001 — API base must be host-reachable.
      LOGMNG_API_BASE_URL: ${LOGMNG_API_BASE_URL:-http://localhost:9200/api}
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - logmng-net

  mvn-test:
    profiles: ["mvn-test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mvn-test
    volumes:
      - ./backend:/work/backend
    working_dir: /work/backend
    # Host: MVN_ARGS='-Dtest=LogDbServiceTest' ./scripts/docker-local-manual-test.sh test-backend
    environment:
      MVN_ARGS: ${MVN_ARGS:-}
    command: ["/bin/bash", "-lc", "mvn -q test ${MVN_ARGS:-}"]
    networks:
      - logmng-net

  npm-test:
    profiles: ["npm-test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.npm-test
    volumes:
      - ./frontend:/work/frontend
      # Isolate node_modules from host bind-mount (avoids npm ci ENOTEMPTY / mixed OS).
      - npm_test_node_modules:/work/frontend/node_modules
      - ./backend:/work/backend:ro
      # Tests resolve repo-root scripts (e.g. src/constants/*.test.js → ../../../scripts/…).
      - ./scripts:/work/scripts:ro
    working_dir: /work/frontend
    environment:
      CI: "true"
    command: ["/bin/bash", "-lc", "npm ci && npm test -- --watchAll=false"]
    networks:
      - logmng-net

volumes:
  pgdata:
  pgdata_pb:
  pgdata_imagelog:
  npm_test_node_modules:

networks:
  logmng-net:
    name: logmng-local-net
