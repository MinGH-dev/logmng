# 1. Purpose

- Provide operator-driven user management without HR provisioning as the default v2 path.
- Define mutation APIs for manual department tree composition (root + child).
- Define direct user registration contract and quick-entry data contract so FE can implement:
  - "immediately previous value"
  - "recent values"
  for `employeeNumber`, `name`, `rank`, `permissionGroupId`.

# 2. Authorization model

- **Screen access**: caller must be authenticated and have user-management-class screen access:
  - `is_system_admin = true`, or
  - `allowedScreenIds` contains `user-management` (or an equivalent user-management view key used by implementation).
- **Mutation APIs** (`POST`, `DELETE` in this spec): require write function:
  - `is_system_admin = true`, or
  - `screenFunctions['user-management'].write = true`.
- **Read API** (`GET /quick-entry/options`): same screen access; write permission is not required.

Errors:
- `401 UNAUTHORIZED`: no valid session.
- `403 FORBIDDEN`: screen access denied.
- `403 FUNCTION_NOT_ALLOWED`: screen visible but write function denied for mutation API (including `DELETE`).

# 3. Domain identifiers and field rules

- `departmentId`: **legacy field name**. Actual semantic value is `departmentCode` (string code), not numeric DB id.
- `parentDepartmentId`: **legacy field name** in path/response. Actual semantic value is parent `departmentCode` (string code), nullable for root.
- `permissionGroupId`: numeric id of canonical `permission_group` row.
- `userId`: numeric `app_user.id` returned after creation.
- `employeeNumber`: string, 1..32, trimmed, non-blank.
- `name`: string, 1..100, trimmed, non-blank.
- `rank`: string, 1..100, trimmed, non-blank.

Naming compatibility note:
- FE/BE must keep payload key names (`departmentId`, `parentDepartmentId`) for compatibility.
- Semantic interpretation is code-based: treat these fields as `departmentCode`/`parentDepartmentCode` string values.
- Type-safe clients should map as:
  - `departmentId: string` (sample: `"DI-PLAT"`)
  - `parentDepartmentId: string | null` (sample: `"DI"` or `null`)

Validation failures return:
- `400 INVALID_INPUT` with field-level message/details per project error wrapper.

# 4. APIs

## 4.1 POST /api/user-management-v2/departments/root

Create a top-level department node.

**Request body**

```json
{
  "name": "디지털혁신본부",
  "code": "DI",
  "sortOrder": 10,
  "changeReason": "v2 수동 트리 구성 시작"
}
```

| Field | Type | Required | Description |
|------|------|----------|-------------|
| name | string | Yes | Department display name. |
| code | string | No | Optional unique code (if product keeps code semantics). |
| sortOrder | integer | No | Sibling order among root nodes. |
| changeReason | string | Yes | Non-blank mutation reason (trimmed). |

**Success (201)**

```json
{
  "success": true,
  "data": {
    "departmentId": "DI",
    "name": "디지털혁신본부",
    "code": "DI",
    "parentDepartmentId": null,
    "sortOrder": 10
  }
}
```

**Errors**
- `400 INVALID_INPUT`
- `409 DEPARTMENT_CODE_DUPLICATED` (when `code` uniqueness is enabled)

## 4.2 POST /api/user-management-v2/departments/{parentDepartmentId}/children

Create a child department under an existing parent.

**Path param**
- `parentDepartmentId` (string, required) - parent department code.

**Request body**

```json
{
  "name": "플랫폼개발팀",
  "code": "DI-PLAT",
  "sortOrder": 20,
  "changeReason": "하위 조직 추가"
}
```

**Success (201)**

```json
{
  "success": true,
  "data": {
    "departmentId": "DI-PLAT",
    "name": "플랫폼개발팀",
    "code": "DI-PLAT",
    "parentDepartmentId": "DI",
    "sortOrder": 20
  }
}
```

**Errors**
- `400 INVALID_INPUT`
- `404 DEPARTMENT_NOT_FOUND` (parent code not found)
- `409 DEPARTMENT_CODE_DUPLICATED` (when `code` uniqueness is enabled)

## 4.3 DELETE /api/user-management-v2/departments/{departmentId}

Remove a leaf department node when no blocking references exist.

**Path param**

- `departmentId` (string, required) — legacy field name; **department code** to delete (same semantics as other v2 department paths).

**Request body** (JSON, **required** — empty body is contract-invalid for this `DELETE`, same pattern as `DELETE /api/users/{userId}`)

```json
{
  "changeReason": "조직 정리 — 미사용 부서 제거"
}
```

| Field | Type | Required | Description |
|------|------|----------|-------------|
| changeReason | string | Yes | Non-blank mutation reason after trim; align MF-03 / max **500** chars with other v2 mutations. |

**Success (200)**

Envelope: common `ApiResponse` with `success: true`. **`data`**: implementation-defined minimal summary (e.g. deleted `departmentId` / code) or `null` — DOC-CODE-SYNC with backend.

**Errors**

- `400 INVALID_INPUT` — missing/blank/`changeReason` over limit, etc.
- `404 DEPARTMENT_NOT_FOUND` — no department for the given code.
- `409 DEPARTMENT_HAS_CHILDREN` — department has child departments; delete children first.
- `409 DEPARTMENT_HAS_ACTIVE_USERS` — one or more `app_user` rows still reference this department.
- `409 DEPARTMENT_ORG_LINK_REFERENCES` — `department_org_link` (or equivalent org link) still references this department.

HTTP status SHOULD align with project patterns (`404` / `409` with `ApiResponse.code` as above; document if implementation uses a single conflict status for all three `409` cases).

## 4.4 POST /api/user-management-v2/users/direct

Directly register a user under a selected department (no HR provisioning dependency).

**Request body**

```json
{
  "departmentId": "DI-PLAT",
  "employeeNumber": "20261234",
  "name": "홍길동",
  "rank": "대리",
  "permissionGroupId": 3,
  "changeReason": "운영자 직접 등록"
}
```

| Field | Type | Required | Description |
|------|------|----------|-------------|
| departmentId | string | Yes | Legacy field name. Actual meaning is target department code (`departmentCode`). |
| employeeNumber | string | Yes | Manual entry value (no HR lookup required). |
| name | string | Yes | Manual entry value. |
| rank | string | Yes | Manual entry value. |
| permissionGroupId | number | Yes | Selected permission group id. |
| changeReason | string | Yes | Non-blank mutation reason (trimmed). |

**Success (201)**

```json
{
  "success": true,
  "data": {
    "userId": 20261234,
    "employeeNumber": "20261234",
    "name": "홍길동",
    "rank": "대리",
    "departmentId": "DI-PLAT",
    "permissionGroupId": 3,
    "createdAt": "2026-04-08T10:00:00Z"
  }
}
```

**Errors**
- `400 INVALID_INPUT`
- `404 DEPARTMENT_NOT_FOUND`
- `404 PERMISSION_GROUP_NOT_FOUND`
- `409 USER_EMPLOYEE_NUMBER_DUPLICATED`

## 4.5 GET /api/user-management-v2/quick-entry/options

Return quick-entry values for FE form acceleration. Scope is per authenticated operator.

**Query**
- `fields` (optional, csv): subset of `employeeNumber,name,rank,permissionGroupId`.
- `limit` (optional, integer): default 10, max 20.

**Success (200)**

```json
{
  "success": true,
  "data": {
    "employeeNumber": {
      "previous": "20261234",
      "recent": ["20261234", "20261235", "20261236"]
    },
    "name": {
      "previous": "홍길동",
      "recent": ["홍길동", "김철수", "이영희"]
    },
    "rank": {
      "previous": "대리",
      "recent": ["대리", "과장", "차장"]
    },
    "permissionGroupId": {
      "previous": 3,
      "recent": [3, 5, 7]
    }
  }
}
```

Contract notes:
- `previous`: immediately previous successful direct-registration value for that operator and field; `null` if absent.
- `recent`: most-recent-first unique list for that operator and field.
- If storage strategy is not yet persistent, backend MAY serve session-scoped values, but response shape MUST remain identical.

**Errors**
- `400 INVALID_INPUT` (invalid `fields` or `limit`)

# 5. Mutation audit and activity logging contract

- All mutation APIs in this spec (`departments/root`, `departments/{id}/children`, `DELETE departments/{departmentId}`, `users/direct`) MUST require `changeReason` in the request body (including `DELETE` JSON body).
- Backend MUST persist actor + timestamp + target identifiers in audit trail.
- Detailed action type strings are governed by `specs/activity-action-types.spec.yaml`.
- **Expected activity log (success paths, contract)**: `departments/root` → `action_type` **`DEPARTMENT_CREATE_ROOT`** with **`action_detail`** per §3 **department_admin**; `departments/{parent}/children` → **`DEPARTMENT_CREATE_CHILD`**; **`DELETE departments/{departmentId}`** → **`DEPARTMENT_DELETE`** with **`action_detail`** per §3 **department_admin** (e.g. **`changeReason`**, **`departmentCode`**, optional **`before`** snapshot for deleted node — DOC-CODE-SYNC); `users/direct` → **`USER_CREATE`** with **`registrationSource`** **`USER_MANAGEMENT_V2_DIRECT`** and **user_admin** keys (see `specs/activity-action-types.spec.yaml` §2.8, §3). **`USER_UPDATE` MUST NOT** substitute for these operations.

# 6. Compatibility notes

- Existing HR provisioning APIs under `/api/provisioning/*` remain valid during transition.
- User Management v2 FE must not require provisioning flow to complete direct user registration.

