# 3. 사용자 모델 설계

## 3.1 사용자 데이터 구조
```javascript
{
  userId: string,           // 8자리 숫자 사번 (PK)
  password: string,         // 해시된 패스워드 (BCrypt)
  name: string,             // 사용자 이름
  email: string,            // 이메일 (선택)
  department: string,       // 부서 (선택)
  role: string,             // 'ADMIN' | 'USER' (기본값: 'USER')
  isActive: boolean,        // 활성화 여부 (기본값: true)
  createdAt: timestamp,     // 생성일시
  updatedAt: timestamp,     // 수정일시
  createdBy: string,        // 생성자 userId
  updatedBy: string         // 수정자 userId
}
```

## 3.2 전산요청서 데이터 구조
```javascript
{
  id: string,               // 요청서 ID (UUID)
  userId: string,           // 대상 사용자 userId
  requestType: string,      // 'CREATE' | 'UPDATE' | 'DELETE'
  fileName: string,         // 원본 파일명
  filePath: string,         // 저장된 파일 경로
  fileSize: number,         // 파일 크기 (bytes)
  reason: string,            // 사유 (텍스트, 필수)
  uploadedAt: timestamp,    // 업로드 일시
  uploadedBy: string        // 업로드한 관리자 userId
}
```

**중요: 전산요청서는 이력 관리 (Immutable)**
- 전산요청서는 생성 후 변경/삭제 불가
- 파일을 잘못 올렸더라도 임의로 변경 불가
- 새로운 요청이 필요한 경우 새로운 전산요청서를 추가로 업로드
- 모든 전산요청서는 이력으로 보관되어 감사 추적 가능

## 3.3 데이터베이스 스키마
```sql
-- 사용자 테이블
CREATE TABLE users (
  user_id VARCHAR(8) PRIMARY KEY,
  password VARCHAR(255) NOT NULL,
  name VARCHAR(100) NOT NULL,
  email VARCHAR(255),
  department VARCHAR(100),
  role VARCHAR(20) DEFAULT 'USER' CHECK (role IN ('ADMIN', 'USER')),
  is_active BOOLEAN DEFAULT true,
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
  created_by VARCHAR(8),
  updated_by VARCHAR(8)
);

-- 전산요청서 테이블 (이력 관리, 변경 불가)
CREATE TABLE user_request_documents (
  id VARCHAR(36) PRIMARY KEY,
  user_id VARCHAR(8) NOT NULL,
  request_type VARCHAR(20) NOT NULL CHECK (request_type IN ('CREATE', 'UPDATE', 'DELETE')),
  file_name VARCHAR(255) NOT NULL,
  file_path VARCHAR(500) NOT NULL,
  file_size BIGINT NOT NULL,
  reason TEXT NOT NULL,  -- 사유 (필수)
  uploaded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
  uploaded_by VARCHAR(8) NOT NULL,
  FOREIGN KEY (user_id) REFERENCES users(user_id),
  FOREIGN KEY (uploaded_by) REFERENCES users(user_id)
);
-- 주의: 이 테이블의 레코드는 생성 후 변경/삭제 불가 (이력 관리)

-- 인덱스
CREATE INDEX idx_users_role ON users(role);
CREATE INDEX idx_users_is_active ON users(is_active);
CREATE INDEX idx_request_docs_user_id ON user_request_documents(user_id);
CREATE INDEX idx_request_docs_uploaded_at ON user_request_documents(uploaded_at);
```

