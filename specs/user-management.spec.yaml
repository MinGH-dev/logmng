      currentPage: number
      totalPages: number
      totalCount: number
      pageSize: number
```

### GET /api/users/hr-sync/history/:historyId
동기화 상세 이력 조회 (관리자 전용)
```yaml
request:
  headers:
    Authorization: Bearer <token>
  params:
