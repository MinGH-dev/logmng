# 5. API 설계

## 5.1 사용자 관리 API

### POST /api/users
사용자 생성 (관리자 전용)
```yaml
request:
  headers:
    Authorization: Bearer <token>
  body:
    userId: string (8자리 숫자, 필수)
    password: string (필수, 최소 8자)
    name: string (필수)
    email: string (선택)
    department: string (선택)
    role: string ('ADMIN' | 'USER', 기본값: 'USER')
  multipart/form-data:
    requestDocument: file (PDF, 필수, 최대 10MB)
    reason: string (사유, 필수, 최대 1000자)

response:
  success: boolean
  data:
    userId: string
    name: string
    email: string
    department: string
    role: string
    createdAt: timestamp
    requestDocument:
      id: string
      fileName: string
      uploadedAt: timestamp
  error: string (optional)
```

### GET /api/users
사용자 목록 조회 (관리자 전용). **현재 구현**: `docs/api-definition.md` §7.1.
```yaml
request:
  headers:
    Authorization: Bearer <token>
  query:
    page: number (기본값: 1)
    pageSize: number (기본값: 20)
    role: string ('ADMIN' | 'USER', 선택)
    isActive: boolean (선택)
    search: string (userId 또는 name 검색, 선택)

response:
  success: boolean
  data:
    users: array
      - userId: string
        name: string
        email: string
        department: string
        role: string
        isSystemAdmin: boolean  # 시스템 관리자 여부 (요건 20250303)
        isActive: boolean
        createdAt: timestamp
        updatedAt: timestamp
    pagination:
      currentPage: number
      totalPages: number
      totalCount: number
      pageSize: number
```

### GET /api/users/:userId
사용자 상세 조회
```yaml
request:
  headers:
    Authorization: Bearer <token>
  params:
    userId: string (8자리 숫자)

response:
  success: boolean
  data:
    userId: string
    name: string
    email: string
    department: string
    role: string
    isActive: boolean
    createdAt: timestamp
    updatedAt: timestamp
    createdBy: string
    updatedBy: string
  error: string (optional)
```

### PUT /api/users/:userId
사용자 정보 수정 (관리자 전용). **현재 구현**: `docs/api-definition.md` §7.2 — 역할 변경만 지원.
```yaml
request:
  headers:
    Authorization: Bearer <token>
  params:
    userId: string (8자리 숫자 또는 username)
  body:
    name: string (선택)
    email: string (선택)
    department: string (선택)
    role: string ('ADMIN' | 'USER', 선택)
    isActive: boolean (선택)
    password: string (선택, 변경 시에만)
  multipart/form-data:
    requestDocument: file (PDF, 필수, 최대 10MB)
    reason: string (사유, 필수, 최대 1000자)

response:
  success: boolean
  data:
    userId: string
    name: string
    email: string
    department: string
    role: string
    isSystemAdmin: boolean  # 시스템 관리자 여부 (요건 20250303)
    isActive: boolean
    updatedAt: timestamp
    requestDocument:
      id: string
      fileName: string
      uploadedAt: timestamp
  error: string (optional)

# 에러 코드 (역할 변경 시, 요건 20250303)
# SYSTEM_ADMIN_IMMUTABLE: 대상이 시스템 관리자(수정 불가)
# LAST_SYSTEM_ADMIN_BLOCKED: 강등 시 시스템 관리자가 0명이 됨
```

### DELETE /api/users/:userId
사용자 삭제 (관리자 전용)
```yaml
request:
