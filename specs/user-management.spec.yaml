# 12. 비기능 요구사항

## 12.1 성능
- 사용자 목록 조회: 1초 이내 (페이지네이션)
- 파일 업로드: 10MB 기준 5초 이내
- 파일 다운로드: 즉시 응답
- 인사배치 동기화: 
  - 전체 동기화: 1000명 기준 5분 이내
  - 증분 동기화: 변경된 사용자만 처리, 1분 이내
  - 오라클 DB 조회: 타임아웃 30초

## 12.2 보안
- 패스워드 해싱: BCrypt (salt rounds: 10)
- 파일 업로드: MIME 타입 검증
- 권한 체크: 모든 관리자 기능에 적용
- SQL Injection 방지: PreparedStatement 사용
- 오라클 DB 연결: 
  - 연결 정보는 환경변수로 관리
  - 연결 풀 사용 (최대 연결 수 제한)
  - 읽기 전용 계정 사용 권장

## 12.3 사용성
- 파일 업로드 진행률 표시
- 입력 검증 실시간 피드백
- 오류 메시지 명확성
- 동기화 진행 상황 실시간 표시
- 동기화 이력 상세 정보 제공

