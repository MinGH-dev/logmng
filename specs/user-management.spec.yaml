# 6. 인사배치 연동 설계

## 6.1 오라클 DB 연동

### 6.1.1 연결 정보
- 데이터베이스: Oracle Database
- 연결 방식: JDBC 또는 node-oracledb
- View 테이블: TODO: 실제 View 테이블명 확인 필요
- 연결 풀: 최대 연결 수 설정 필요

### 6.1.2 View 테이블 스키마 (예상)
```sql
-- TODO: 실제 View 테이블 구조 확인 필요
-- 예상 구조:
CREATE OR REPLACE VIEW HR_USER_VIEW AS
SELECT 
  EMP_NO VARCHAR2(8),           -- 사번 (8자리 숫자)
  EMP_NAME VARCHAR2(100),       -- 이름
  EMAIL VARCHAR2(255),          -- 이메일
  DEPT_CODE VARCHAR2(20),       -- 부서 코드
  DEPT_NAME VARCHAR2(100),      -- 부서명
  POSITION_CODE VARCHAR2(20),   -- 직급 코드
  POSITION_NAME VARCHAR2(100),  -- 직급명
  STATUS VARCHAR2(20),          -- 상태 (ACTIVE, INACTIVE, RETIRED 등)
  UPDATE_DATE DATE              -- 최종 수정일
FROM HR_EMPLOYEE_MASTER;
```

### 6.1.3 필요한 필드 매핑
```javascript
{
  // 오라클 View → 시스템 users 테이블 매핑
  EMP_NO → userId (8자리 숫자)
  EMP_NAME → name
  EMAIL → email
  DEPT_NAME → department
  STATUS → isActive (ACTIVE면 true, 그 외 false)
  UPDATE_DATE → 동기화 시점 확인용
}
```

## 6.2 동기화 프로세스

### 6.2.1 전체 동기화 (FULL SYNC)
1. 오라클 DB View에서 전체 사용자 데이터 조회
2. 시스템 users 테이블과 비교
3. 신규 사용자: 자동 생성 (role='USER', password는 임시 생성 또는 AD 연동 대기)
4. 기존 사용자: 정보 업데이트 (이름, 이메일, 부서 등)
5. 삭제된 사용자: isActive=false로 설정 (권한 회수)
6. 동기화 이력 저장

### 6.2.2 증분 동기화 (INCREMENTAL SYNC)
1. 마지막 동기화 이후 UPDATE_DATE가 변경된 사용자만 조회
2. 변경사항 반영
3. 동기화 이력 저장

### 6.2.3 동기화 규칙
- **신규 사용자 추가**:
  - 오라클에 존재하지만 시스템에 없는 사용자
  - 자동으로 role='USER'로 생성
  - password는 임시 생성 (향후 AD 연동 시 자동 처리)
  - createdBy='SYSTEM'으로 기록
  
- **사용자 정보 업데이트**:
  - 이름, 이메일, 부서 정보 업데이트
  - updatedBy='SYSTEM'으로 기록
  
- **사용자 비활성화**:
  - 오라클에서 삭제되었거나 STATUS가 INACTIVE인 경우
  - isActive=false로 설정
  - 실제 삭제는 하지 않음 (이력 보존)
  - updatedBy='SYSTEM'으로 기록

- **관리자 계정 보호**:
  - role='ADMIN'인 사용자는 자동 동기화에서 제외
  - 관리자 계정은 수동으로만 관리

## 6.3 배치 스케줄링

### 6.3.1 스케줄 설정
- 실행 주기: TODO: 일정 확인 필요 (예: 매일 새벽 2시)
- 실행 방식: cron job 또는 node-cron
- 중복 실행 방지: 동시 실행 체크

### 6.3.2 배치 작업 설정
```javascript
// node-cron 예시
const cron = require('node-cron');

// 매일 새벽 2시에 전체 동기화
cron.schedule('0 2 * * *', async () => {
  await hrSyncService.syncUsers('FULL');
});

// 매시간 증분 동기화 (선택)
cron.schedule('0 * * * *', async () => {
  await hrSyncService.syncUsers('INCREMENTAL');
});
```

## 6.4 오류 처리

### 6.4.1 오류 유형
- 오라클 DB 연결 실패
- View 테이블 조회 실패
- 데이터 매핑 오류
- 사용자 생성/업데이트 실패

### 6.4.2 오류 처리 전략
- 연결 실패: 재시도 로직 (최대 3회)
- 개별 사용자 처리 실패: 에러 로그 기록 후 다음 사용자 계속 처리
- 전체 동기화 실패: 상태를 'FAILED'로 기록, 에러 메시지 저장
- 부분 실패: 성공한 건수와 실패한 건수 모두 기록

## 6.5 동기화 이력 관리

### 6.5.1 이력 저장 항목
- 동기화 시작/종료 시간
- 동기화 타입 (FULL/INCREMENTAL)
- 처리된 총 레코드 수
- 생성/업데이트/비활성화 건수
- 오류 건수 및 오류 메시지
- 개별 사용자 처리 상세 내역

### 6.5.2 이력 보관 정책
- TODO: 보관 기간 결정 (예: 90일)
- 오래된 이력은 자동 삭제 또는 아카이브

