# 4. 권한 관리 설계

## 4.1 권한 레벨
- **ADMIN**: 모든 사용자 관리 기능 사용 가능
  - 사용자 추가/변경/삭제
  - 전산요청서 업로드
  - 모든 로그 조회
- **USER**: 일반 사용자
  - 본인 정보 조회/수정 (제한적)
  - 로그 조회 (권한 범위 내)

## 4.2 권한 체크 미들웨어
```javascript
// 관리자 권한 체크
function requireAdmin(req, res, next) {
  const user = req.user; // 인증 미들웨어에서 설정
  if (!user || user.role !== 'ADMIN') {
    return res.status(403).json({
      success: false,
      error: 'Forbidden',
      message: '관리자 권한이 필요합니다.'
    });
  }
  next();
}

// 활성 사용자 체크
function requireActiveUser(req, res, next) {
  const user = req.user;
  if (!user || !user.isActive) {
    return res.status(403).json({
      success: false,
      error: 'Forbidden',
      message: '비활성화된 사용자입니다.'
    });
  }
  next();
}
```

## 4.3 초기 관리자 계정
