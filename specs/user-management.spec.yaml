# 9. 보안 고려사항

## 8.1 패스워드 보안
- BCrypt 해싱 (salt rounds: 10)
- 평문 패스워드 저장 금지
- 로그에 패스워드 정보 기록 금지

## 8.2 파일 보안
- 업로드 파일 스캔 (바이러스 검사, 선택)
- 파일 경로 노출 방지 (직접 접근 차단)
- 관리자 권한으로만 다운로드 가능
- 파일 변경/삭제 방지 (이력 관리)
  - API에서 전산요청서 수정/삭제 엔드포인트 제공하지 않음
  - 데이터베이스 레벨에서도 변경 방지 (권한 제한)

## 8.3 로깅
- 사용자 생성/수정/삭제 작업 로깅
- 전산요청서 업로드 로깅
- 권한 위반 시도 로깅
- PII(개인정보) 노출 최소화

