# 1. 개요 및 목표

## 1.1 목표
- 사용자 추가/변경/삭제 기능 제공
- 관리자 권한 기반 접근 제어
- 전산요청서 PDF 업로드 및 이력 관리 (변경 불가)
- 전산요청서 업로드 시 사유 입력 필수
- 8자리 숫자 사번 기반 로그인 ID 체계
- 패스워드 관리 (현재: 별도 등록, 향후: AD 연동)
- 인사배치 연동을 통한 사용자 자동 추가/삭제 (권한 회수)

## 1.2 비목표
- AD 연동 구현 (현재 단계에서는 제외, 향후 작업)
- 복잡한 권한 레벨 체계 (관리자/일반 사용자 2단계)
- 패스워드 복구 기능 (초기 릴리즈 제외)
- 사용자 그룹/조직 관리 (초기 릴리즈 제외)

## 1.3 범위
- 백엔드: 사용자 CRUD API, 권한 체크 미들웨어, 파일 업로드 처리, 인사배치 연동 배치 작업
- 프론트엔드: 사용자 관리 UI, 전산요청서 업로드 UI, 동기화 이력 조회 UI
- 데이터베이스: 사용자 테이블, 전산요청서 파일 저장, 동기화 이력 테이블
- 외부 연동: 오라클 DB View 테이블 연동

