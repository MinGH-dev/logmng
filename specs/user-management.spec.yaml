# 15. 참고사항

## 15.1 기술 스택
- 백엔드: Node.js, Express
- 데이터베이스: PostgreSQL (시스템 DB), Oracle Database (인사배치 DB)
- 오라클 DB 연동: node-oracledb 또는 oracledb
- 배치 스케줄링: node-cron
- 파일 업로드: multer 또는 express-fileupload
- 패스워드 해싱: bcrypt
- TODO: 인증 라이브러리 결정 (jsonwebtoken 등)

## 15.2 의존성
- bcrypt: 패스워드 해싱
- multer 또는 express-fileupload: 파일 업로드
- pg: PostgreSQL 클라이언트
- oracledb 또는 node-oracledb: Oracle Database 클라이언트
- node-cron: 배치 스케줄링
- uuid: 전산요청서 ID 생성

## 15.3 제약사항
- 파일 저장: 로컬 파일 시스템 (향후 객체 스토리지로 확장 가능)
- 브라우저 호환성: Chrome, Firefox, Safari 최신 2버전
- 최대 파일 크기: 10MB
- 오라클 DB 연결: 네트워크 지연 고려 필요
- 동기화 실행: 동시 실행 불가 (중복 실행 방지)

