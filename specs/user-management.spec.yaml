# 7. 파일 업로드 설계

## 6.1 파일 저장 구조
```
backend/src/data/request-documents/
  ├── {userId}/
  │   ├── {documentId}.pdf
  │   └── ...
  └── ...
```

## 6.2 파일 업로드 제약사항
- 파일 형식: PDF만 허용
- 최대 파일 크기: 10MB
- 파일명: 원본 파일명 저장, 중복 시 타임스탬프 추가
- 보안: 관리자 권한 체크 필수
- **이력 관리**: 파일 업로드 후 변경/삭제 불가 (Immutable)
  - 잘못 업로드한 경우에도 파일 변경 불가
  - 새로운 요청이 필요한 경우 새로운 전산요청서를 추가로 업로드
  - 모든 전산요청서는 이력으로 보관되어 감사 추적 가능

## 6.3 파일 검증
- MIME 타입 검증 (application/pdf)
- 파일 확장자 검증 (.pdf)
- 파일 크기 검증
- PDF 파일 무결성 검증 (선택)

---
# 8. 입력 검증 및 오류 처리

## 7.1 사용자 ID 검증
- 8자리 숫자만 허용
- 정규식: `^[0-9]{8}$`
- 중복 체크 (생성 시)

## 7.2 패스워드 검증
- 최소 길이: 8자
- TODO: 패스워드 복잡도 정책 결정
  - 대문자/소문자/숫자/특수문자 조합 필수 여부
  - 금지된 패스워드 목록

## 7.3 전산요청서 검증
- 파일 존재 여부 체크
- 파일 형식 체크 (PDF)
- 파일 크기 체크 (10MB 이하)
- 사유(reason) 필수 체크 (최대 1000자)

## 7.4 오류 코드
```javascript
{
  // 사용자 관련
  USER_NOT_FOUND: 'USER_001',
  USER_ALREADY_EXISTS: 'USER_002',
  INVALID_USER_ID_FORMAT: 'USER_003',
  INVALID_PASSWORD: 'USER_004',
  // 시스템 관리자 보호 (요건 20250303)
  SYSTEM_ADMIN_IMMUTABLE: 'USER_005',   // 대상이 시스템 관리자(수정·삭제 불가)
  LAST_SYSTEM_ADMIN_BLOCKED: 'USER_006', // 강등 시 시스템 관리자가 0명이 됨
  
  // 권한 관련
  UNAUTHORIZED: 'AUTH_001',
  FORBIDDEN: 'AUTH_002',
  INACTIVE_USER: 'AUTH_003',
  
  // 파일 관련
  FILE_REQUIRED: 'FILE_001',
  INVALID_FILE_TYPE: 'FILE_002',
  FILE_TOO_LARGE: 'FILE_003',
  FILE_UPLOAD_FAILED: 'FILE_004',
  
  // 전산요청서 관련
  REQUEST_DOCUMENT_REQUIRED: 'DOC_001',
  REQUEST_REASON_REQUIRED: 'DOC_002',
  REQUEST_REASON_TOO_LONG: 'DOC_003',
  DOCUMENT_IMMUTABLE: 'DOC_004'  // 전산요청서 변경/삭제 시도 시
}
```

