- 전산요청서 변경/삭제 시도 테스트 (실패 확인)
- 권한 위반 시도 테스트
- 인사배치 수동 동기화 실행 플로우
- 동기화 이력 조회 플로우
- 동기화 상세 이력 조회 플로우
- 자동 배치 동기화 실행 확인

