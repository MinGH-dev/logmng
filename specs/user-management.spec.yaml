# 2. 현재 상태 분석

## 2.1 현재 사용자 관련 기능
- ActivityLog에서 userId 기반 사용자 추적
- getUserList() 함수로 활동 로그 기반 사용자 목록 조회
- 실제 사용자 정보 저장/관리 기능 없음
- 인증/인가 기능 없음

## 2.2 문제점
- 사용자 정보가 활동 로그에만 의존
- 권한 관리 기능 없음
- 사용자 정보의 일관성 보장 어려움
- 관리자/일반 사용자 구분 불가

## 2.3 개선 필요사항
- 사용자 정보 전용 데이터 모델 필요
- 권한 체계 도입 (관리자/일반 사용자)
- 사용자 CRUD API 구현
- 전산요청서 관리 기능
- 인사배치 연동을 통한 사용자 자동 관리 기능

