# 2. DB contract (for contract.md / schema)

## 2.1 New tables

### permission_group
- **Definition**: `backend/src/main/resources/db/schema.sql`
- **Columns**:
  - `id`: BIGSERIAL PRIMARY KEY
  - `code`: VARCHAR(50) UNIQUE NOT NULL
  - `name`: VARCHAR(200) NOT NULL
  - `description`: TEXT NULL
  - `sort_order`: INT DEFAULT 0
- **Indexes**: unique on `code`; optional index on `sort_order` for listing.

### app_user_permission_group
- **Definition**: `backend/src/main/resources/db/schema.sql`
- **Columns**:
  - `user_id`: VARCHAR(100) NOT NULL — references app_user(username)
  - `permission_group_id`: BIGINT NOT NULL — references permission_group(id)
  - PRIMARY KEY (user_id, permission_group_id)
- **Constraints**: UNIQUE on `user_id` — enforces single permission group per user (req 20250304).
- **Foreign keys**:
  - FK to app_user(username) ON DELETE CASCADE (or RESTRICT; decide per requirement)
  - FK to permission_group(id) ON DELETE CASCADE (or RESTRICT)
- **Indexes**: index on permission_group_id for "users in group" queries.

**Note**: app_user PK is `id` (BIGSERIAL); `username` is UNIQUE. `app_user_permission_group.user_id` references `app_user.username` (historical). API/UI canonical userId is numeric app_user.id (req 20260316); backend maps id↔username when reading/writing API.

### permission_group_screen
- **Definition**: `backend/src/main/resources/db/schema.sql`
- **Columns**:
  - `permission_group_id`: BIGINT NOT NULL — references permission_group(id) ON DELETE CASCADE
  - `screen_id`: VARCHAR(50) NOT NULL
  - `scope`: VARCHAR(10) NULL — 'self' | 'team' | 'all'. For activity-log, statistics, search-history, pending-approvals, **user-management-v2**. NULL or missing = 'team'. (req 20250303, 20250304-team-scope-default, req 20260409-user-management-v2-read-scope)
  - `read`: BOOLEAN NULL — explicit read flag. NULL = use derived default (true when screen present). main: read-only.
  - `write`: BOOLEAN NULL — explicit write flag. NULL = use derived default. Only for screens that support write (management screens).
  - `approve`: BOOLEAN NULL — explicit approve flag. NULL = use derived default. Only for search-history, pending-approvals.
  - `decrypt`: BOOLEAN NULL — explicit decrypt flag. NULL = use derived default (false). Only for main (검색하기). When true, user may call decrypt API; when false/NULL, 403 FUNCTION_NOT_ALLOWED. req 20260306.
  - PRIMARY KEY (permission_group_id, screen_id)
- **Foreign keys**: FK to permission_group(id) ON DELETE CASCADE
- **Indexes**: optional `idx_permission_group_screen_screen` on (screen_id) for reverse lookup
- **Migration**: Add `read`, `write`, `approve` via ALTER TABLE; existing rows remain NULL (backward compat, use derivation).

## 2.2 Existing tables (no schema change)

- **department**: code, parent_code, name, sort_order — unchanged.
- **app_user**: id, username, role, department_code, ... — unchanged.

## 2.3 search_history (join and storage semantics)

- **search_history.user_id** stores numeric **app_user.id** (requester). Join condition everywhere: **app_user.id = search_history.user_id**. Do not store username in `search_history.user_id`; do not join on `app_user.username = search_history.user_id`.
- API list requester filter `userId` and response `userId` are numeric `app_user.id`. See docs/contract.md, docs/api-definition.md §6.1.

