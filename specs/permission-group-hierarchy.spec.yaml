# 1. API contract

Base URL: http://localhost:9200/api (per docs/contract.md).
All endpoints below are **admin-only** (is_system_admin=true). Otherwise 403, code: "FORBIDDEN". (req 20250303)

## 1.0 Activity log — permission group `action_detail`

When `user_activity_log.action_type` is a **permission-group family** code (`PERMISSION_GROUP_*`, `ASSIGN_USER_TO_PERMISSION_GROUP`, `UNASSIGN_USER_FROM_PERMISSION_GROUP` — see `specs/activity-action-types.spec.yaml` §2.3), the persisted **`action_detail`** JSON for audit reconstruction is specified in **`specs/activity-permission-group-audit.spec.yaml`** (`permissionGroupAuditV1`). **`AllowedScreenItem`** in audit snapshots matches §1.1 below (nested `allowedScreens`, not a flat string list).

## 1.1 Permission group CRUD

**Base path**: `/api/permission-groups`

| Method | Path | Description |
|--------|------|-------------|
| GET | /api/permission-groups | List all permission groups |
| POST | /api/permission-groups | Create a permission group |
| GET | /api/permission-groups/{id} | Get one permission group |
| PUT | /api/permission-groups/{id} | Update a permission group |
| DELETE | /api/permission-groups/{id} | Delete a permission group |

### allowedScreens item shape (request/response)

```ts
type AllowedScreenItem = {
  screenId: string;           // required
  scope?: 'self' | 'team' | 'all';    // activity-log, statistics, search-history, pending-approvals, user-management-v2; omitted/null = 'team' (req 20250304-team-scope-default)
  read?: boolean;            // optional; default true when screen present (backward compat). main: read-only; omit write/approve
  write?: boolean;           // optional; only for screens that support write (management screens)
  approve?: boolean;         // optional; only for search-history, pending-approvals
  decrypt?: boolean;        // optional; only for main (검색하기). When true, user may request decryption; when false/omitted, decrypt API returns 403 FUNCTION_NOT_ALLOWED. req 20260306.
};
```

**Backward compatibility**: When `read`, `write`, `approve` are omitted, apply defaults per §1.1.1 (derived rules). Existing clients sending `{ screenId, scope? }` continue to work. Legacy: `allowedScreens` as `string[]` (e.g. `["main","search-history"]`) is accepted; each string is treated as `{ screenId: s }` with scope/read/write/approve omitted.

### Scope values (per-screen)

**Terminology (UI)**: Permission config UI uses "조회" (read/list); scope labels **본인** | **부서** | **전체** (API values `self` | `team` | `all`). Do not use "조회만" or "팀" in user-facing copy.

**List/read scope (조회 범위)** — configurable. For screens that support scope (activity-log, statistics, search-history, pending-approvals, **user-management-v2**), the admin may select:
- `'self'` (본인): User sees only their own data. Filter controls (user, department, IP) hidden or disabled.
- `'team'` (부서): User sees data for users in the same department only (same app_user.department_code). Default when scope omitted or null (req 20250304-team-scope-default).
- `'all'` (전체): User sees all users' data. Filter controls available.

**Approval scope (승인 범위)** — fixed, not configurable. For screens with approve (search-history, pending-approvals), **`canApproveForRequester`** is **same department only**: approver `department_code` must **equal** requester `department_code` (no ancestor-chain, no global approver row). Eligibility for decrypt approve flows is **permission-group `approve`** first, then **`is_system_admin=true` overrides to no effective approve**; **`ADMIN_EXT` and other non–system-admin groups** use **group flags only** (see `docs/contract.md` 「복호화 승인 자격」). The scope dropdown affects only **list/read**; it does not widen or narrow who may approve beyond that contract.

Screens **without** a scope field in this contract ignore `scope` in `allowedScreens` (only screen access is checked). **Exception:** **`user-management-v2`** uses `scope` for **read/list/view** of user and department hierarchy data (see §4.3). Legacy **`user-management`** does not use this `scope` field in the same way; UM v2 scope is keyed under **`screenScopes['user-management-v2']`**.

### 1.1.1 Validation rules (read/write/approve per screen)

On POST/PUT permission-groups, validate each `allowedScreens` item against per-screen allowed functions. 400 `INVALID_SCREEN_FUNCTION` when invalid.

**main** (deprecated): same as pb-feplog/java-fw-imagelog; use pb-feplog, java-fw-imagelog for new config (req 20260318). **pb-feplog, java-fw-imagelog**: read + optional decrypt; write/approve forbidden.

| screen_id | read | write | approve | decrypt | Validation |
|-----------|------|-------|---------|--------|------------|
| main | ✓ | — | — | ✓ optional | (deprecated) read + optional decrypt; write/approve must be false or omitted. |
| pb-feplog | ✓ | — | — | ✓ optional | read required; decrypt optional. write/approve must be false or omitted. |
| java-fw-imagelog | ✓ | — | — | ✓ optional | read required; decrypt optional. write/approve must be false or omitted. |
| search-history | ✓ | — | ✓ | — | read required; approve optional. write/decrypt must be false or omitted |
| activity-log | ✓ | — | — | — | read only |
| statistics | ✓ | — | — | — | read only |
| pending-approvals | ✓ | — | ✓ | — | read required; approve optional. write/decrypt must be false or omitted. **read** = screen access + list/search history (see §4.3 `listContext`); **approve** = decrypt approve/reject APIs only (req `20260407-pending-approvals-history-search-readonly-requester`) |
| user-management | ✓ | ✓ | — | — | read required; write optional. approve/decrypt must be false or omitted |
| user-management-v2 | ✓ | ✓ | — | — | same as user-management; **optional `scope`** `self`|`team`|`all` (default **team**) — `specs/user-management-v2.spec.yaml`, req 20260409 |
| hr-sync-poc | ✓ | — | — | — | read only; PoC HR Sync preview/config/snapshots UI. write/approve/decrypt must be false or omitted |
| user-management-v2-poc | ✓ | — | — | — | read only; isolated PoC UM v2 clone + `/api/hr-sync/poc/user-mgmt/*`. write/approve/decrypt must be false or omitted (req `20260408-poc-user-management-v2-isolated-clone`) |
| department-approvers | ✓ | ✓ | — | — | read required; write optional. approve/decrypt must be false or omitted |
| user-permission-hierarchy | ✓ | ✓ | — | — | read required; write optional. approve/decrypt must be false or omitted |
| permission-group-management | ✓ | ✓ | — | — | same as user-permission-hierarchy |
| screen-display-labels | ✓ | — | — | — | read only (menu/navigation grant for the Screen display names admin view). write/approve/decrypt must be false or omitted. **PUT /api/screen-display-labels** (persist label config) remains **system-admin-only** (`is_system_admin=true`); permission-group does not grant that write path. |

**Defaults when omitted** (backward compat): read=true; write/approve = per-screen default (main: false; search-history/pending-approvals: **approve default false** when omitted; management screens: write=true when screen supports it). decrypt: only for main; default false when omitted (req 20260306). **Legacy `decrypt_approver` is not used** for derivation after req 20260323 migration.

### GET /api/permission-groups
- **Response (data)**: array of permission group objects.
  - `id`: number (BIGINT)
  - `code`: string (unique)
  - `name`: string
  - `description`: string | null
  - `sortOrder`: number (optional, default 0)
  - `allowedScreens`: array of `AllowedScreenItem` (§1.1) — screen IDs and per-screen functions. `scope` for activity-log, statistics, search-history, pending-approvals, **user-management-v2**; omitted or null = 'team'. `read`, `write`, `approve` explicit when stored; omitted in response when default.
- **Errors**: 401, 403

### POST /api/permission-groups
- **Request body** (JSON):
  - `code`: string (required, unique)
  - `name`: string (required)
  - `description`: string (optional)
  - `sortOrder`: number (optional, default 0)
  - `allowedScreens`: array of `AllowedScreenItem` (optional) — validate screenId (§4); validate read/write/approve per §1.1.1. 400 `INVALID_SCREEN_ID` or `INVALID_SCREEN_FUNCTION` if invalid. For scope-supporting screens, scope defaults to 'team' when omitted.
- **Response (data)**: created permission group object (same shape as above, with `id`, `allowedScreens`).
- **Status**: 201 on success.
- **Errors**: 400 validation (e.g. code/name empty, code duplicate, INVALID_SCREEN_ID, INVALID_SCREEN_FUNCTION), 401, 403

### GET /api/permission-groups/{id}
- **Path**: `id` — permission group ID (Long).
- **Response (data)**: single permission group object (includes `allowedScreens: AllowedScreenItem[]`).
- **Errors**: 401, 403, 404 → code: "PERMISSION_GROUP_NOT_FOUND"

### PUT /api/permission-groups/{id}
- **Path**: `id` — permission group ID (Long).
- **Request body** (JSON):
  - `code`: string (optional)
  - `name`: string (optional)
  - `description`: string (optional)
  - `sortOrder`: number (optional)
  - `allowedScreens`: array of `AllowedScreenItem` (optional) — validate each screenId (§4) and read/write/approve (§1.1.1). 400 `INVALID_SCREEN_ID` or `INVALID_SCREEN_FUNCTION` if invalid. For scope-supporting screens, scope defaults to 'team' when omitted.
- **Response (data)**: updated permission group object (includes `allowedScreens`).
- **Errors**: 400 validation (including INVALID_SCREEN_ID, INVALID_SCREEN_FUNCTION), 401, 403, 404 → "PERMISSION_GROUP_NOT_FOUND"

### DELETE /api/permission-groups/{id}
- **Path**: `id` — permission group ID (Long).
- **Response (data)**: null or success message. **Status**: 200 or 204.
- **Behavior**: If users are assigned to the group, either (a) return 400 with code "PERMISSION_GROUP_HAS_USERS" and do not delete, or (b) cascade unassign then delete; contract chooses (a) unless DBA/requirement specifies cascade.
- **Errors**: 401, 403, 404, 400 if has users and no cascade

## 1.2 User–group assignment

**Single permission group per user** (req 20250304-single-permission-group-per-user): each user can have at most one permission group. Assigning a new group auto-replaces any existing assignment.

**Option A — group-centric** (implemented)
- **POST** `/api/permission-groups/{id}/users` — assign user to group. If user already has a different group, the old assignment is removed and the new one is created (auto-replace).
- **DELETE** `/api/permission-groups/{id}/users/{userId}` — remove user from group.
- **GET** `/api/permission-groups/{id}/users` — list users in group (optional).

**Contract choice**: Option A for consistency with department approvers (`/api/departments/{code}/approvers`). **API userId** = numeric `app_user.id` (JSON number). DB column `app_user_permission_group.user_id` may remain username for FK; backend maps id↔username.

### POST /api/permission-groups/{id}/users
- **Path**: `id` — permission group ID (Long).
- **Request body** (JSON): `{ "userId": number }` — numeric `app_user.id`.
- **Response (data)**: e.g. `{ "userId", "permissionGroupId", "permissionGroupCode" }` (userId number) or success message.
- **Status**: 201 or 200.
- **Behavior**: If the user is already assigned to a **different** group, the old assignment is removed first (auto-replace). DB UNIQUE constraint on `user_id` enforces at most one group per user.
- **Errors**: 400 (userId empty), 401, 403, 404 group → "PERMISSION_GROUP_NOT_FOUND", 404 user → "USER_NOT_FOUND", 400 same group → "USER_ALREADY_IN_GROUP"

### DELETE /api/permission-groups/{id}/users/{userId}
- **Path**: `id` — group ID (Long); `userId` — numeric `app_user.id`.
- **Response (data)**: null or success message. **Status**: 200 or 204.
- **Errors**: 401, 403, 404

### GET /api/permission-groups/{id}/users (optional)
- **Response (data)**: array of user summary objects, e.g. `{ "userId" (number), "username", "departmentCode", "isSystemAdmin" }` (role 제외, req 20250303).
- **Errors**: 401, 403, 404

## 1.3 User-permission hierarchy

Single endpoint that returns department tree with users and their permission group per department. Each user has at most one permission group (req 20250304). **Admin-only.**

- **GET** `/api/departments/user-permission-hierarchy`

**Query**: optional `format` — "tree" (default) | "flat". Same semantics as GET /api/departments for tree vs flat.

**Response (data)**:
- **Tree format**: array of root nodes; each node:
  - `code`, `parentCode`, `name`, `sortOrder` (per existing department)
  - `children`: array (recursive same structure)
  - `users`: array of user-permission objects:
    - `userId` (numeric app_user.id): number
    - `isSystemAdmin`: boolean — system administrator flag (immutable; req 20250303)
    - `permissionGroups`: array of `{ "id", "code", "name" }` (0 or 1 element; single group per user, req 20250304)
- **Flat format**: array of department nodes with `code`, `parentCode`, `name`, `sortOrder`, `users` (same shape as above). No `children`.

**Errors**: 401, 403

**Note**: Reuse existing department tree structure (code/parent_code); backend joins app_user (by department_code) and app_user_permission_group + permission_group to attach the user's permission group per department. Each user has at most one group (UNIQUE on user_id).

