# 5. Approval-only permission groups

## 5.1 Definition (condition-based, group name irrelevant)

A permission group is **approval-only** when ALL of the following are true:
- `allowedScreenIds` does **NOT** include any log search screen (`pb-feplog`, `java-fw-imagelog`; or deprecated `main`) (no log search access)
- `allowedScreenIds` **includes** `pending-approvals` (approval screen access)
- (Optional) `approve=true` for the pending-approvals screen (can perform approve/reject)

This definition applies to **any** group matching the condition — e.g. APPROVE_USER, TEAM_APPROVER, REGIONAL_APPROVER. The group **name/code is irrelevant**; only the screen configuration matters. req 20260318: use pb-feplog/java-fw-imagelog instead of main.

## 5.2 Applicable rules

The following rules apply identically to **all** approval-only groups:

| Rule | Behavior |
|------|----------|
| **Login redirect** | If no log search screen (pb-feplog, java-fw-imagelog) in `allowedScreenIds`, redirect to the first allowed screen (e.g. pending-approvals). |
| **Menu filtering** | Sidebar shows only screens in `allowedScreenIds`. No log search screens → no "로그 검색" items. |
| **API enforcement** | No pb-feplog/java-fw-imagelog in `allowedScreenIds` → log search API returns 403 FORBIDDEN or LOG_TYPE_NOT_ALLOWED. **`GET /api/search-history`** with **`listContext=pending-approvals`** allowed when **`pending-approvals` read** (req `20260407-pending-approvals-history-search-readonly-requester`). `pending-approvals` with **effective** `approve=true` (§4.4) → approve/reject allowed when `canApproveForRequester` passes. |
| **Action hiding** | Screen action buttons that navigate to or depend on a screen the user lacks access to must be hidden (e.g. 재조회, 재요청 hidden when no log search screen). |

## 5.3 Examples

- **APPROVE_USER**: `allowedScreenIds = [pending-approvals]`, approve=true. Team leader decrypt approver.
- **TEAM_APPROVER**: Same screen configuration, different name. Same rules apply.
- **CUSTOM_APPROVER**: Any custom group with no `main` + `pending-approvals`. Same rules apply.

