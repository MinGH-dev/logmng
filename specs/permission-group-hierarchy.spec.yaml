# 4. Screen IDs and screen-based access

## 4.1 Allowed screen ID list

| screen_id | Description (frontend MENU_TREE view) |
|-----------|--------------------------------------|
| main | 검색하기 (log search main) |
| search-history | 검색 이력 |
| activity-log | 활동 이력 |
| statistics | 활동로그 통계 |
| pending-approvals | 승인 대기 |
| user-management | 사용자 관리 |
| department-approvers | 부서별 결재자 |
| user-permission-hierarchy | 사용자 권한 계층 |
| permission-group-management | 권한 그룹 관리 (same as user-permission-hierarchy) |

Validation: PUT/POST permission-groups with `allowedScreens` must have each value in this list; otherwise 400 `INVALID_SCREEN_ID`.

## 4.2 Auth response extension (allowedScreenIds, screenScopes)

**POST /api/auth/login** and **GET /api/auth/me** (or equivalent) response (user object) includes:
- `allowedScreenIds`: string[] — union of allowed screens from all of the user's permission groups. If user is system admin (is_system_admin=true), return all screen IDs.
- `screenScopes`: Record<string, 'self'|'all'> — per-screen scope for screens that support it (activity-log, statistics, search-history). Key = screen_id, value = 'self' or 'all'. Omitted screens or is_system_admin=true: frontend treats as full scope (show filters). **Purpose**: Frontend uses this to decide whether to show/hide user, department, IP filter controls (scope=self → hide; scope=all → show).

## 4.3 Screen-based API access enforcement

APIs that correspond to screens must validate: user has is_system_admin=true **or** user has the required screen in at least one of their permission groups. Otherwise 403.

**Scope enforcement (activity-log, statistics, search-history only)** — when is_system_admin=false:
- Use scope from permission group for that screen (from `screenScopes` or permission_group_screen.scope).
- scope='self' or null: Backend overrides userId with current user; ignores department, ip params. For detail/getById: enforce ownership; return 403/404 if accessing another user's data.
- scope='all': Pass request params as-is; no override.
- is_system_admin=true: Always full scope; ignore permission group scope.

| screen_id | APIs (require this screen or is_system_admin=true) | Scope enforcement when is_system_admin=false |
|-----------|------------------------------------|---------------------------------------------|
| main | /api/logs/db-refactored/*, /api/log-types/* | — |
| search-history | /api/search-history/* | Use scope from permission group: self → own data only; all → pass params as-is |
| activity-log | /api/activity-log/* | Use scope from permission group: self → override userId; all → pass params as-is |
| statistics | /api/statistics/* | Use scope from permission group: self → override userId, ignore department/ip; all → pass params as-is |
| pending-approvals | /api/search-history/pending, /api/search-history/{id}/approve, /api/search-history/{id}/reject | — |
| user-management | /api/users, /api/users/approvers, /api/users/approvers/{userId} | — |
| department-approvers | /api/departments, /api/departments/{code}/approvers, /api/departments/{code}/members, /api/departments/{code}/approvers/default | — |
| user-permission-hierarchy | /api/permission-groups/*, /api/departments/user-permission-hierarchy | — |
| permission-group-management | Same as user-permission-hierarchy | — |

## 4.4 screenFunctions (per-screen function availability)

**Requirement**: `docs/requirements/20250303-screen-function-availability.md`

### Structure

```ts
type ScreenFunctionCapability = {
  read: boolean;
  write?: boolean;   // present only for screens that support write
  approve?: boolean; // present only for screens that support approve
};

// Auth response (login, GET /api/auth/me)
screenFunctions: Record<screenId, ScreenFunctionCapability>
```

### Explicit vs derived

| Source | When used |
|--------|-----------|
| **Explicit** | `permission_group_screen` stores `read`, `write`, `approve` per (permission_group_id, screen_id). Auth response uses these values when non-null. UI sends explicit checkbox values via allowedScreens. |
| **Derived** | When DB has no explicit read/write/approve (legacy rows or omitted), apply derivation rules below. Backward compat: existing data behaves as before. NULL = use derived default. |

**Explicit storage**: Admin selects read/write/approve via checkboxes per screen. Stored in `permission_group_screen.read`, `.write`, `.approve`. main: read-only (no write/approve checkboxes).

**Migration**: New columns `read`, `write`, `approve` in `permission_group_screen` (§2.1). NULL = use derived default. After migration, UI can set explicit values via POST/PUT allowedScreens.

### Derivation rules (when explicit values absent)

- **read**: `allowedScreenIds` includes screen_id OR `is_system_admin=true`. (Unchanged.)
- **write**: read=true AND screen supports write AND (explicit write=true from permission_group_screen OR legacy: read implies write for management screens). When explicit: use stored value.
- **approve**: read=true AND (explicit approve=true from permission_group_screen OR legacy: decrypt_approver) AND (`decrypt_approver` canApproveForRequester OR `is_system_admin=true`). Only for search-history, pending-approvals. **Note**: approve in screenFunctions requires BOTH (1) group allows approve for that screen, AND (2) user is decrypt_approver or is_system_admin.

### Per-screen mapping (explicit config vs runtime)

| screen_id | read | write | approve | Explicit config | Runtime (screenFunctions) |
|-----------|------|-------|---------|-----------------|---------------------------|
| main | ✓ | — | — | read only; write/approve forbidden | Always `{ read: true }` when in allowedScreenIds |
| search-history | ✓ | — | ✓ | read + approve optional | approve = (group.approve) AND (decrypt_approver or is_system_admin) |
| activity-log | ✓ | — | — | read only | scope from screenScopes |
| statistics | ✓ | — | — | read only | scope from screenScopes |
| pending-approvals | ✓ | — | ✓ | read + approve optional | approve = (group.approve) AND (decrypt_approver or is_system_admin) |
| user-management | ✓ | ✓ | — | read + write optional | write from group or derived |
| department-approvers | ✓ | ✓ | — | read + write optional | write from group or derived |
| user-permission-hierarchy | ✓ | ✓ | — | read + write optional | write from group or derived |
| permission-group-management | ✓ | ✓ | — | same as user-permission-hierarchy | same |

### main (검색하기) special case

- main is always `{ read: true }` when user has main in allowedScreenIds.
- No write, no approve. Search and view only.
- Decryption is gated by search-history approval flow, not main.

### API enforcement (function-level)

- **Approve APIs** (POST /api/search-history/{id}/approve, POST /api/search-history/{id}/reject): Require approve=true (decrypt_approver or is_system_admin). Otherwise 403, `code: "FUNCTION_NOT_ALLOWED"`.
- **Write APIs** (user CRUD, permission group CRUD, department approvers, etc.): Require write=true for the corresponding screen. Otherwise 403, `code: "FUNCTION_NOT_ALLOWED"`.
- **Write + scope**: Write APIs must validate both function (write) and scope (self/all). When scope=self, editing another user's data must return 403.
- **Error response**: 403 FUNCTION_NOT_ALLOWED must use a generic message; avoid revealing resource existence or internal structure.
