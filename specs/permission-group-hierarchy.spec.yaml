## 4.2 Auth response extension (allowedScreenIds, screenScopes)

**POST /api/auth/login** and **GET /api/auth/me** (or equivalent) response (user object) includes:
- `allowedScreenIds`: string[] — allowed screens from the user's permission group (single group per user, req 20250304). If user is system admin (is_system_admin=true), return all screen IDs.
- `screenScopes`: Record<string, 'self'|'team'|'all'> — per-screen **list/read scope** (조회 범위) for screens that support it (activity-log, statistics, search-history, pending-approvals, **user-management-v2**). Key = screen_id, value = 'self' (본인), 'team' (부서), or 'all' (전체). **Purpose**: Controls which data is listed (self → own only; team → same department; all → all). **`is_system_admin=true`**: effective read scope for UM v2 is always **`all`**; do not let permission-group scope restrict admins (req 20260409). Approval (승인) is always department-scoped and not configurable for search-history/pending-approvals; this field does not change who can approve.
- `selfContext`: `{ department: string | null, username: string, userId: number }` — authoritative display payload for **visible locked self-context** on applicable shared-pattern screens when effective scope is `self`. **`userId`** is **numeric** **`app_user.id`** (JSON number). Login identifier remains `app_user.username`; only the exposed "userId" in API/UI is numeric id.

## 4.3 Screen-based API access enforcement

APIs that correspond to screens must validate: user has is_system_admin=true **or** user has the required screen in their permission group. Otherwise 403.

**`listContext` on `GET /api/search-history` and `GET /api/search-history/{id}`** (req `20260407-pending-approvals-history-search-readonly-requester`): Optional query **`listContext`** = `search-history` \| `pending-approvals` selects which screen’s **`screenScopes`** applies to row visibility (docs/api-definition.md §6.1.2–6.1.4). This is **option (a)** from the requirement: one HTTP path, explicit context for scope resolution. **Option (c)** at implementation: a single service path should apply filters + scope so list behavior does not drift between screens. **Option (b)** (extend `/pending` only) is not the primary contract; `/pending` remains a **PENDING-only** queue unless a future change updates this spec.

**Scope enforcement (activity-log, statistics, search-history, pending-approvals)** — when is_system_admin=false:
- Use scope from permission group for that screen (from `screenScopes` or permission_group_screen.scope). Default for scope-supporting screens = 'team' when null/omitted.
- scope='self': Backend must keep the result set fixed to the current authenticated user. On applicable shared-pattern screens (`activity-log`, `statistics`, `search-history`), this scope means **visible locked self-context**, not hidden user/requester fields: `department`, `username`, and `userId` stay visible in `department -> username -> userId` order, are not editable, and must be populated from auth/current-user `selfContext`. For `activity-log`, backend overrides `userId` with the current user and ignores or safely overrides widening inputs such as `username`, `department`, `departmentCode`, `ipAddress`, and equivalent "all departments" representations (`all`, `ALL`, `전체`, empty value, etc.), so those inputs never widen scope. For `GET /api/search-history` / `GET /api/search-history/{id}`, apply the same self/team/all pattern using the **effective** scope key (`search-history` vs `pending-approvals` per `listContext`): when that key is `self`, ignore requester filters and return only the current requester’s rows where applicable; for detail, deny if the row is outside that visibility. For detail/getById on other screens: enforce list-consistent visibility; return 403/404 if accessing another user's data.
- scope='team': Filter by current user's department (same department_code only). For `GET /api/search-history` (effective scope key per `listContext`), requester filters are allowed only as additional narrowing filters inside that same-department set. For the shared department filter-options endpoint `GET /api/filter-options/departments?screen={screenId}`, return **only the current user's own department** as the sole selectable option; do not expose sibling or unrelated departments.
- scope='all': Pass request params as-is; no override. For `GET /api/search-history`, requester filters narrow the full visible set and never expand scope (for the effective scope key).
- scope null/omitted: Treated as 'team' (default for scope-supporting screens).
- is_system_admin=true: Always full scope; ignore permission group scope.

**Scope enforcement (user-management-v2)** — req `20260409-user-management-v2-read-scope`. When `is_system_admin=false` and the session is authorized for **`user-management-v2`**, apply **`screenScopes['user-management-v2']`** to **read/list** paths used by the UM v2 UI. Default when null/omitted in stored permission rows: **`team`** (same as other scope screens, req `20250304-team-scope-default`).
- **`self`**: **`GET /api/users`** returns **only** the authenticated user's row. **`GET /api/departments/user-permission-hierarchy`** must not reveal unrelated departments/users beyond minimal display context for that operator (implementation-defined redaction: e.g. single department chain without sibling departments — DOC-CODE-SYNC with `specs/user-management-v2.spec.yaml`). **`GET /api/user-management-v2/quick-entry/options`** must not leak other users' data; values are operator-scoped only. Any client-supplied query parameters that would widen visibility **must** be ignored or server-overridden (no client-trusted widening).
- **`team`**: Restrict listed users to **same `department_code`** as the current user (same semantics as **team** for activity statistics / activity log — `DepartmentScopeHelper` family). Hierarchy/tree: include only department nodes on paths relevant to that scope (default product choice: subtree rooted at the user's department including descendants — DOC-CODE-SYNC). If the operator's `department_code` is null/blank, follow the same edge policy as statistics **`team`** (no widened peer list — DOC-CODE-SYNC).
- **`all`**: No additional read filter beyond existing screen-access and write rules for management APIs.
- **`is_system_admin=true`**: Effective read scope is always **`all`** for UM v2; permission-group `scope` must not restrict admins.
- **Mutations** reachable from UM v2 (v2 **`POST`/`DELETE`**, **`DELETE /api/users/{userId}`**, permission-group assignment flows, etc.): must **not** create/update/delete targets **outside** the operator's effective read scope unless product explicitly documents otherwise. Denial responses: **`403`** with **`FUNCTION_NOT_ALLOWED`** or **`FORBIDDEN`**; implementations may use **`404`** **`USER_NOT_FOUND`** / **`DEPARTMENT_NOT_FOUND`** when hiding resource existence is required — DOC-CODE-SYNC.

**Shared filter-options contract**:
- `GET /api/filter-options/departments?screen={screenId}` is the authoritative contract for **editable department select options** on `activity-log`, `statistics`, `search-history`, and **`pending-approvals`** (복호화 승인 관리 — req `20260407-pending-approvals-history-search-readonly-requester`).
- Query parameter `screen` is required and must be one of `activity-log`, `statistics`, `search-history`, `pending-approvals`.
- Backend must validate access against the requested `screenId`, not against a separate shared screen.
- `scope='self'` for the requested screen must **not** be documented or implemented as the authoritative source of locked self display values. The locked Department/Username/User ID values come from auth/current-user `selfContext`. Because the endpoint is only for editable options, implementations may return an empty option list or skip calling it in `scope='self'`.
- `scope='team'` for the requested screen returns only the current user's own department option.
- `scope='all'` (or `is_system_admin=true`) returns the full current department option set.

