# 3. Error codes (api-definition §11)

## 3.1 Permission group

| code | Meaning |
|------|--------|
| PERMISSION_GROUP_NOT_FOUND | No permission group with given id (404) |
| PERMISSION_GROUP_HAS_USERS | Cannot delete group while users are assigned (400) |
| USER_ALREADY_IN_GROUP | User already assigned to this group (400) |
| INVALID_SCREEN_ID | Invalid screen_id in allowedScreens (400) — value not in allowed list (§4) |
| INVALID_SCREEN_FUNCTION | Invalid read/write/approve combination for a screen (400) — e.g. main with write=true, or screen that does not support approve with approve=true. Per §1.1.1. |

## 3.2 User management (PUT /api/users/{userId})

| code | Meaning |
|------|--------|
| SYSTEM_ADMIN_IMMUTABLE | Target user is system admin; role change/delete blocked (400) |
| LAST_SYSTEM_ADMIN_BLOCKED | Demotion would leave zero system admins (400) |

Existing: USER_NOT_FOUND, FORBIDDEN, INVALID_INPUT, SELF_DEMOTION_BLOCKED, LAST_ADMIN_BLOCKED remain as-is.

## 3.3 API function-level enforcement (req 20250303-screen-function-availability)

| code | Meaning |
|------|--------|
| FUNCTION_NOT_ALLOWED | User lacks the required function (approve, write, decrypt) for the action. 403. Use generic message; avoid revealing resource existence or internal structure. |
| LOG_TYPE_NOT_ALLOWED | User lacks the screen for the requested log type. pb_feplog: requires **pb-feplog** or **pb-fep-log-search** in allowedScreenIds. java_fw_imglog: **java-fw-imagelog**. Log search/detail/decrypt API returns 403. |

**Related**: INVALID_SCREEN_FUNCTION (§3.1) — 400 when POST/PUT permission-groups `allowedScreens` has invalid read/write/approve per screen (e.g. main with write=true, approve on unsupported screen).

