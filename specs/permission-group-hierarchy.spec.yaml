# 4. Screen IDs and screen-based access

## 4.1 Allowed screen ID list

| screen_id | Description (frontend MENU_TREE view) |
|-----------|--------------------------------------|
| main | 검색하기 (log search main) |
| search-history | 검색 이력 |
| activity-log | 활동 이력 |
| statistics | 활동로그 통계 |
| pending-approvals | 승인 대기 |
| user-management | 사용자 관리 |
| department-approvers | 부서별 결재자 |
| user-permission-hierarchy | 사용자 권한 계층 |

Validation: PUT/POST permission-groups with `allowedScreens` must have each value in this list; otherwise 400 `INVALID_SCREEN_ID`.

## 4.2 Auth response extension (allowedScreenIds)

**POST /api/auth/login** and **GET /api/auth/me** (or equivalent) response (user object) includes:
- `allowedScreenIds`: string[] — union of allowed screens from all of the user's permission groups. If user is ADMIN, return all screen IDs (or omit and treat ADMIN as full access).

## 4.3 Screen-based API access enforcement

APIs that correspond to screens must validate: user has role=ADMIN **or** user has the required screen in at least one of their permission groups. Otherwise 403.

| screen_id | APIs (require this screen or ADMIN) |
|-----------|------------------------------------|
| main | /api/logs/db-refactored/*, /api/log-types/* |
| search-history | /api/search-history/* |
| activity-log | /api/activity-log/* |
| statistics | /api/statistics/* |
| pending-approvals | /api/search-history/pending, /api/search-history/{id}/approve, /api/search-history/{id}/reject |
| user-management | /api/users, /api/users/approvers, /api/users/approvers/{userId} |
| department-approvers | /api/departments, /api/departments/{code}/approvers |
| user-permission-hierarchy | /api/permission-groups/*, /api/departments/user-permission-hierarchy |
