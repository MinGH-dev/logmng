## 4.4 screenFunctions (per-screen function availability)

**Requirement**: `docs/requirements/20250303-screen-function-availability.md`

### Structure

```ts
type ScreenFunctionCapability = {
  read: boolean;
  write?: boolean;   // present only for screens that support write
  approve?: boolean; // present only for screens that support approve
  decrypt?: boolean; // present for pb-feplog, java-fw-imagelog (and main deprecated); when true, user may request decryption (decrypt API). req 20260318.
};

// Auth response (login, GET /api/auth/me)
screenFunctions: Record<screenId, ScreenFunctionCapability>
```

### Explicit vs derived

| Source | When used |
|--------|-----------|
| **Explicit** | `permission_group_screen` stores `read`, `write`, `approve` per (permission_group_id, screen_id). Auth response uses these values when non-null. UI sends explicit checkbox values via allowedScreens. |
| **Derived** | When DB has no explicit read/write/approve (legacy rows or omitted), apply derivation rules below. Backward compat: existing data behaves as before. NULL = use derived default. |

**Explicit storage**: Admin selects read/write/approve via checkboxes per screen. Stored in `permission_group_screen.read`, `.write`, `.approve`. main, pb-feplog, java-fw-imagelog: read + optional decrypt (no write/approve checkboxes). req 20260318.

**Migration**: New columns `read`, `write`, `approve` in `permission_group_screen` (§2.1). NULL = use derived default. After migration, UI can set explicit values via POST/PUT allowedScreens.

### Derivation rules (when explicit values absent)

- **read**: `allowedScreenIds` includes screen_id OR `is_system_admin=true`. (Unchanged.)
- **write**: read=true AND screen supports write AND (explicit write=true from permission_group_screen OR legacy: read implies write for management screens). When explicit: use stored value.
- **approve** (search-history, pending-approvals only; req 20260323): **Step 1** — read=true AND (explicit `approve=true` from `permission_group_screen` OR derived default per §1.1.1). **Step 2** — if `is_system_admin=true`, set **effective approve false** for these decrypt-approval screens (override). **Step 3** — otherwise effective approve = result of step 1. **`ADMIN_EXT` and other `is_system_admin=false` users**: only steps 1 and 3. **`decrypt_approver` is not read** for this derivation. **`canApproveForRequester`** (per-request) further requires approver and requester **same `department_code`** — not part of screenFunctions snapshot alone.

### Per-screen mapping (explicit config vs runtime)

| screen_id | read | write | approve | decrypt | Explicit config | Runtime (screenFunctions) |
|-----------|------|-------|---------|--------|-----------------|---------------------------|
| main | ✓ | — | — | ✓ | (deprecated) read + decrypt optional | `{ read: true, decrypt: pgs.decrypt ?? false }` when in allowedScreenIds |
| pb-feplog | ✓ | — | — | ✓ | read + decrypt optional | `{ read: true, decrypt: pgs.decrypt ?? false }` when in allowedScreenIds |
| pb-fep-log-search | ✓ | — | — | ✓ | read + decrypt optional (same log search family as pb-feplog) | `{ read: true, decrypt: pgs.decrypt ?? false }` when in allowedScreenIds |
| java-fw-imagelog | ✓ | — | — | ✓ | read + decrypt optional | `{ read: true, decrypt: pgs.decrypt ?? false }` when in allowedScreenIds |
| search-history | ✓ | — | ✓ | — | read + approve optional | approve_effective = group.approve then false if is_system_admin (see §4.4 derivation) |
| activity-log | ✓ | — | — | — | read only | scope from screenScopes |
| statistics | ✓ | — | — | — | read only | scope from screenScopes |
| pending-approvals | ✓ | — | ✓ | — | read + approve optional | same as search-history row |
| user-management | ✓ | ✓ | — | — | read + write optional | write from group or derived |
| user-management-v2 | ✓ | ✓ | — | — | read + write optional | write from group or derived; **scope** from `screenScopes['user-management-v2']` for read/list (§4.3) |
| hr-sync-poc | ✓ | — | — | — | read only | `{ read: true }` when in allowedScreenIds |
| user-management-v2-poc | ✓ | — | — | — | read only | `{ read: true }` when in allowedScreenIds |
| department-approvers | ✓ | ✓ | — | — | read + write optional | write from group or derived |
| user-permission-hierarchy | ✓ | ✓ | — | — | read + write optional | write from group or derived |
| permission-group-management | ✓ | ✓ | — | — | same as user-permission-hierarchy | same |
| screen-display-labels | ✓ | — | — | — | read only | `{ read: true }` when in allowedScreenIds (no write/approve/decrypt in group config) |

### Log search screens (pb-feplog, pb-fep-log-search, java-fw-imagelog) — req 20260318

- **pb-feplog** (PB FEP v1.0.0), **pb-fep-log-search** (PB FEP v2.0.0), **java-fw-imagelog** (Java FW Image Log): each is `{ read: true, decrypt?: boolean }` when user has that screen in allowedScreenIds. **pb-fep-log-search** shares API **logType** `pb_feplog` with **pb-feplog** but is a separate **screen_id** for permission assignment. main is deprecated; same semantics for backward compat.
- No write, no approve. Search and view only. **logType access**: `pb_feplog` allowed if user has **pb-feplog** or **pb-fep-log-search**; `java_fw_imglog` requires **java-fw-imagelog**. 403 LOG_TYPE_NOT_ALLOWED when not allowed.
- **decrypt**: When permission_group_screen.decrypt is true for that screen, user may call the decrypt API for that log type (subject to decryption-allowed store: user_id, **screen** (pb-feplog or java-fw-imagelog), **guid + row_status** for java_fw_imglog, valid_until). searchHistoryId is not used for authorization (optional for audit). req 20260320.

### API enforcement (function-level)

- **Decrypt allowed list** (GET /api/decrypt/allowed): Require query `screen` (pb-feplog, **pb-fep-log-search**, or java-fw-imagelog) **and** decrypt allowed for the **pb FEP family** (pb-feplog or pb-fep-log-search with decrypt) or java-fw-imagelog per implementation (or is_system_admin). For **pb-fep-log-search**, store lookup uses same key as **pb-feplog**. Response: `{ screen, validUntil, guids, allowedRows: [{ guid, status }] }` (java_fw_imglog: UI uses **allowedRows** for (guid, status) membership; `guids` is distinct-guid summary). req 20260318, 20260320.
- **Decrypt API** (POST /api/logs/decrypt/{logType}): Resolve screen from logType (java_fw_imglog → java-fw-imagelog). Require that screen **and** screenFunctions[screen].decrypt === true (or is_system_admin). Otherwise 403 FUNCTION_NOT_ALLOWED. Authorization: decryption-allowed store (current user, **screen**, **guid + status** for java_fw_imglog, valid_until). java_fw_imglog: **status** required in body; missing/blank → 400 MISSING_STATUS. On composite not in store or expired: 403 DECRYPTION_NOT_APPROVED. req 20260318, 20260320.
- **Log search/detail/advanced-search** (POST/GET /api/logs/db-refactored/*): Require screen for request logType (logType↔screen). Else 403 LOG_TYPE_NOT_ALLOWED.
- **Search history list/detail** (GET /api/search-history, GET /api/search-history/{id}): Require **`search-history` screen** OR (**`pending-approvals` screen** with **read**). Use **`listContext`** + matching **`screenScopes`** per docs/api-definition.md §6.1.2–6.1.4 (req `20260407-pending-approvals-history-search-readonly-requester`).
- **Approve APIs** (POST /api/search-history/{id}/approve, POST /api/search-history/{id}/reject): Require **effective** `screenFunctions.search-history.approve` or `pending-approvals.approve` (§4.4; `is_system_admin` never gains approve by flag alone). **Service layer**: `canApproveForRequester(approver, requester)` — **same `department_code` only**; otherwise 403 `FUNCTION_NOT_ALLOWED`. Pending list: `docs/api-definition.md` §6.1.5.
- **Write APIs** (user CRUD, permission group CRUD, department approvers, etc.): Require write=true for the corresponding screen. Otherwise 403, `code: "FUNCTION_NOT_ALLOWED"`.
- **Write + scope**: Write APIs must validate both function (write) and scope (self/all). When scope=self, editing another user's data must return 403. For **user-management-v2**, validate **write** via **`screenFunctions['user-management-v2'].write`** (not only legacy **`user-management`**) and **effective read scope** for target entities; out-of-scope mutations → **`403`** **`FUNCTION_NOT_ALLOWED`** (or **`404`** / **`FORBIDDEN`** per product — DOC-CODE-SYNC).
- **Error response**: 403 FUNCTION_NOT_ALLOWED must use a generic message; avoid revealing resource existence or internal structure.

