# 3. Error codes to add (api-definition §11)

| code | Meaning |
|------|--------|
| PERMISSION_GROUP_NOT_FOUND | No permission group with given id (404) |
| PERMISSION_GROUP_HAS_USERS | Cannot delete group while users are assigned (400) |
| USER_ALREADY_IN_GROUP | User already assigned to this group (400) |

Existing: USER_NOT_FOUND, FORBIDDEN, INVALID_INPUT remain as-is.
