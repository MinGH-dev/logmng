# 1. Scope

- **Applies when** `user_activity_log.action_type` is one of:
  - `PERMISSION_GROUP_CREATE`
  - `PERMISSION_GROUP_UPDATE`
  - `PERMISSION_GROUP_DELETE`
  - `ASSIGN_USER_TO_PERMISSION_GROUP`
  - `UNASSIGN_USER_FROM_PERMISSION_GROUP`
- **Source of truth for codes**: `specs/activity-action-types.spec.yaml` §2.3.
- **Storage**: JSON in `user_activity_log.action_detail` (same column as today). **No** new tables required by this contract.
- **API exposure**: `GET /api/activity-log/{id}` returns the stored map; `action_detail` includes this structure when present (same authorization/scope as `POST /api/activity-log/search` — see requirement §2.1 Security).

---
# 2. Top-level shape in action_detail

Implementations **may** retain legacy flat keys (`permissionGroupId`, `permissionGroupCode`, …) during transition. **New audit-grade payloads** MUST be nested under a single object key:

| Key | Type | Description |
|-----|------|-------------|
| **`permissionGroupAuditV1`** | object | Versioned audit payload (this spec). |

Other top-level keys in `action_detail` remain category-specific; they MUST NOT duplicate secrets (see §6 Denylist).

---
# 3. permissionGroupAuditV1 (version 1)

## 3.1 Common fields

| Field | Type | Required | Description |
|-------|------|----------|-------------|
| `schemaVersion` | string | yes | Literal **`"1"`** for this document version (evolve with breaking changes). |
| `operation` | string | yes | One of: `CREATE`, `UPDATE`, `DELETE`, `ASSIGN_USER`, `UNASSIGN_USER`. Maps to action types in §4. |
| `permissionGroupId` | number (integer) | yes* | Numeric permission group id (`permission_group.id`). *Required whenever the group is known at write time. |
| `permissionGroupCode` | string | no | Group `code` when known (non-secret identifier). |
| `before` | PermissionGroupSnapshot \| null | no | Pre-mutation snapshot (see §3.3). |
| `after` | PermissionGroupSnapshot \| null | no | Post-mutation snapshot (see §3.3). |
| `targetUserId` | number (integer) | no | Numeric `app_user.id` for assign/unassign operations. |
| `changeReason` | string \| omitted | no | **Provisional (MF-03 / OP-PG-02):** If persisted, MUST be truncated to **max length 500** characters at write time. Reflects `PermissionGroupUpdateRequest.changeReason` when the client sent a non-blank value. **Product may revise** the contract to omit this field from persisted audit in v1 — if so, update this spec and §3.4 before production rollout. |

## 3.2 Large payloads (OP / SR-PG-06)

If `allowedScreens` is too large for storage or policy limits, implementations MAY set:

| Field | Type | Description |
|-------|------|-------------|
| `allowedScreensTruncated` | boolean | When `true`, `before.allowedScreens` and/or `after.allowedScreens` may be incomplete; omit or shorten with this flag set. |

## 3.3 PermissionGroupSnapshot (before / after)

Aligned with **`PermissionGroupResponse`** / create-update DTOs (not an unconstrained entity dump). **OP-PG-01:** use **nested** `allowedScreens` as `AllowedScreenItem[]`, not a flat id-only list.

| Field | Type | Description |
|-------|------|-------------|
| `code` | string | Group code. |
| `name` | string | Display name. |
| `description` | string \| null | Optional description. |
| `sortOrder` | number (integer) | Sort order (default 0 if omitted in API). |
| `allowedScreens` | array of AllowedScreenItem | Same shape as `specs/permission-group-hierarchy.spec.yaml` §1.1. |

### AllowedScreenItem (JSON object)

| Field | Type | Notes |
|-------|------|--------|
| `screenId` | string | Required per item. |
| `scope` | string \| omitted | `'self'` \| `'team'` \| `'all'` where applicable; omitted/null → effective `'team'` per permission-group spec. |
| `read` | boolean \| null | Optional explicit flags. |
| `write` | boolean \| null | |
| `approve` | boolean \| null | |
| `decrypt` | boolean \| null | |

## 3.4 changeReason (MF-03 provisional decision)

- **Contract decision (provisional):** Persist operator-supplied **`changeReason`** inside `permissionGroupAuditV1.changeReason` when provided on **UPDATE**, with **maximum length 500** at persistence time (truncate; do not fail the mutation solely for length unless API validation already rejects).
- **Rationale:** Audit trail for administrative notes; length cap limits PII/free-text risk (Security §2.1).
- **Revisable:** Product may switch to **omit** `changeReason` from persisted audit — update this spec and `docs/contract.md` before implementing that behavior.

## 3.5 Per action_type expectations

| action_type | operation | before | after | targetUserId | changeReason |
|-------------|-----------|--------|-------|--------------|--------------|
| `PERMISSION_GROUP_CREATE` | `CREATE` | null | non-null (created state) | omit | omit |
| `PERMISSION_GROUP_UPDATE` | `UPDATE` | non-null when pre-state read succeeds | non-null when post-state known | omit | optional; max 500 if present |
| `PERMISSION_GROUP_DELETE` | `DELETE` | non-null when pre-delete snapshot available | null | omit | omit |
| `ASSIGN_USER_TO_PERMISSION_GROUP` | `ASSIGN_USER` | omit or null | omit or null* | required | omit |
| `UNASSIGN_USER_FROM_PERMISSION_GROUP` | `UNASSIGN_USER` | omit or null | omit or null* | required | omit |

\*For assign/unassign, **`permissionGroupId`** and **`permissionGroupCode`** are required for audit reconstruction; `before`/`after` full snapshots are optional if product accepts minimal rows — if omitted, `schemaVersion` + `operation` + ids + `targetUserId` still satisfy minimal audit. Prefer snapshots when feasible for consistency with CREATE/UPDATE/DELETE.

