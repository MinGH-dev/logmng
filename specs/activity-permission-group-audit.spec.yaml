# 6. Denylist (must never appear in action_detail)

Persisted JSON MUST NOT contain keys or values copied from secrets or sensitive transport. Align with **`docs/requirements/20260330-activity-types-user-mgmt-permission-group.md`** §2.1 Security (denylist / allowlist approach).

**Forbidden key names (non-exhaustive; block by convention and tests):**

- `password`, `newPassword`, `currentPassword`, `confirmPassword`
- `token`, `accessToken`, `refreshToken`, `authorization`, `secret`, `clientSecret`, `apiKey`
- Raw OAuth / credential blobs

**Forbidden content:**

- Raw unsanitized HTTP request bodies from mutating endpoints
- Decrypted log payload excerpts, unmasked search keywords (unless a separate requirement explicitly allows)

Implementations SHOULD add unit/assertion coverage (requirement §3 TC-07).

