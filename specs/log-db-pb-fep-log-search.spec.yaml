# 8. Backward compatibility and deprecation policy (normative)

1. Canonical product-facing time field for this endpoint is `log_time` (request/filter/sort/response).
2. `log_timestamp` is removed from PB FEP contract; request sort/filter fields and response rows must not include it.
3. Default ordering is `log_time desc`; when `sortSpecs` is present, server applies ordered allowlisted fields only.
4. Time-range filtering uses canonical `log_time` semantics with backend query-time normalization as needed.
