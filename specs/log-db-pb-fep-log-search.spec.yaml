# 1. Endpoint

| Method | Path | Description |
|--------|------|-------------|
| POST | /api/logs/db-refactored/pb-fep-log-search | PB FEP UNION search with wireframe-keyed rows for screen **pb-fep-log-search** only. |

**Does not replace** `POST /api/logs/db-refactored/search` for legacy **pb-feplog** or other callers.

Base URL: `http://localhost:9200/api` (per `docs/contract.md`).

# 2. Auth and access

- Same enforcement family as PB FEP / `logType` **pb_feplog** and screen **pb-fep-log-search** (see `docs/contract.md` — API function-level enforcement).
- **403** `LOG_TYPE_NOT_ALLOWED` or **403** `FUNCTION_NOT_ALLOWED` when the user lacks required screen / function access.
- **401** when unauthenticated.

# 3. Request body

Shape: **`LogDbSearchRequest`** (shared with `POST .../search`). Relevant fields:

```ts
type LogDbSortSpec = { field: string; direction: 'asc' | 'desc' };

type PbFepLogSearchRequest = {
  startDate: string;       // required (product): combined start bound
  endDate: string;       // required (product): combined end bound; start <= end
  loginId: string;       // required, non-blank; equality on wire brodid (same semantics as legacy /search user_id)
  trCode?: string;
  tr_code?: string;
  keywords?: string[];
  logType?: string;      // may default to pb_feplog or be implied
  page?: number;         // default 1
  pageSize?: number;     // default 25; allowed 25 | 50 | 100 (validate)
  displayTemplate?: string;
  sortField?: string;      // canonical time sort key: log_time
  sortDirection?: string;
  sortSpecs?: LogDbSortSpec[];  // cumulative; allowlisted field names; overrides sortField/sortDirection when non-empty
  decryptData?: boolean;
};
```

- **sortSpecs**: ordered list; **field** must be on server allowlist (wireframe / DB mapping). Canonical time field is `log_time`; `log_timestamp` is not allowed. Unknown field → **400**.
- **Time filter behavior (required):** backend applies `startDate`/`endDate` on canonical `log_time` semantics. Query-time normalization from wire time values is allowed, but no schema/API field dependency on `log_timestamp`.

# 4. Response

Common wrapper: **`ApiResponse`**. **`data`** payload:

```ts
type Pagination = {
  currentPage: number;
  totalPages: number;
  totalCount: number;
};

// Wireframe JSON keys are stable; values are sourced from pb_send/pb_recv wire-format columns
// (requirement docs/requirements/20260414-pb-fep-wire-schema-alignment.md §2).
type PbFepWireframeRow = {
  id: number;
  log_type: string;       // branch discriminator with id for stable React keys / expandedRowKeys
  log_time: string | null; // canonical product-facing time field
  tr_code: string | null; // wire tr_code
  login_id: string | null; // wire brodid (same semantics as legacy POST .../search user_id)
  msg_code: string | null; // wire msg_code
  bmsg: string | null; // wire bmsg (or equivalent payload column per decrypt rules)
  log_ch_cd: string | null; // wire log_ch_cd or equivalent
  send_recv: 'SEND' | 'RECV';
  src_ip: string | null; // wire pub_ip
  dest_ip: string;       // placeholder empty or "—" until dedicated wire column agreed
  app_id: string | null; // agreed wire session/term-related field(s), or empty
  data: string | null;   // wire data / payload summary per product & decrypt rules
  request_data?: string | null;
  response_data?: string | null;
  // Keyword match hints (non-plaintext): see "Keyword match hints" below; no decrypted payload on the wire.
  keyword_match_request_data?: boolean;
  keyword_match_response_data?: boolean;
  keyword_match_bmsg?: boolean;
  keyword_match_data?: boolean;
};

type PbFepLogSearchResponseData = {
  data: PbFepWireframeRow[];
  pagination: Pagination;
};
```

## Keyword match hints (`PbFepWireframeRow`, non-plaintext)

**Requirement:** `docs/requirements/20260416-pb-fep-keyword-match-flags-data-full-line-highlight.md` §2. **Security:** response adds **boolean hints only** — no `decrypted_*` payload plaintext; same separation as `docs/requirements/20260415-encrypted-field-search-no-client-plaintext.md`.

When the request applies a **non-empty `keywords`** filter, each row **may** include optional fields naming **which wire columns contributed** to keyword matching, using the **same** per-cell rules as backend keyword filtering (wire substring **or** PB_FEP decrypt-for-match for payload cells).

| JSON key | Meaning |
|----------|---------|
| `keyword_match_request_data` | `true` iff at least one keyword token matches `request_data` (same evaluation as row filter for that cell). |
| `keyword_match_response_data` | `true` iff at least one keyword token matches `response_data`. |
| `keyword_match_bmsg` | `true` iff at least one keyword token matches `error_message` / wire **`bmsg`**. |
| `keyword_match_data` | `true` iff the wireframe **`data`** summary is “implicated” by a matched payload source: if the summary is built preferring non-empty `response_data`, mirror `keyword_match_response_data`; if it falls back to `request_data`, mirror `keyword_match_request_data` (aligns with `buildWireframeDataCellSummary` / UI `streamPayload` use of `data`). |

**Omission vs `false` (normative):**

- When **`keywords` is absent or empty** (no keyword clause): servers **should omit** all four keys on every row (smaller payload, backward compatible). Servers **may** instead include all four with value **`false`**. Clients **must** treat a **missing** key the same as **`false`** for hint purposes.
- When **`keywords` is non-empty**: for each row, servers **should** emit all four keys with explicit **`true`** or **`false`** so clients do not rely on omission semantics under an active keyword filter.

# 5. Errors

| HTTP | code (examples) | When |
|------|-----------------|------|
| 400 | INVALID_INPUT, BAD_REQUEST | Validation, unknown sort field, invalid pageSize |
| 401 | UNAUTHORIZED | Not logged in |
| 403 | LOG_TYPE_NOT_ALLOWED, FUNCTION_NOT_ALLOWED | No PB FEP / pb-fep-log-search access |

# 6. Wireframe row — DB / wire column sourcing (normative)

Requirement: `docs/requirements/20260414-pb-fep-wire-schema-alignment.md` §2 and `docs/requirements/20260414-pb-fep-log-timestamp-physical-removal-bugfix.md`. PB FEP product-facing logical/wire schema is wire-first with canonical time key `log_time`, and PB FEP contracts must not reference `log_timestamp`. Legacy `POST /api/logs/db-refactored/search` keeps stable keys such as `media_code`, `tr_code`, `user_id` mapped to `media_gb`, `tr_code`, `brodid` — see `docs/contract.md` (PB FEP wire schema).

| Wireframe JSON key | Physical / wire source |
|--------------------|-------------------------|
| `log_time` | canonical product-facing wire time field |
| `tr_code` | `tr_code` |
| `login_id` | `brodid` |
| `msg_code` | `msg_code` |
| `bmsg` | `bmsg` (payload rules per backend) |
| `log_ch_cd` | `log_ch_cd` (or equivalent channel field) |
| `send_recv` | Union branch: SEND / RECV |
| `src_ip` | `pub_ip` |
| `dest_ip` | Placeholder until product column exists |
| `app_id` | Product mapping from wire fields |
| `data` | `data` and related payload columns |

