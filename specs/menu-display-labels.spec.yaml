# 1. Purpose

- **GET**: Return persisted display labels and optional **sidebar placement** (`parentGroupId`, `sortOrder`) for configurable screens so authenticated clients can render the sidebar and chrome titles without embedding version strings in code.
- **PUT/PATCH** (system admin): Create or update one or more items per `screenId`, including optional labels and optional parent/order.

# 2. screenId whitelist

- Server **MUST** reject unknown `screenId` values with **400** `INVALID_SCREEN_ID`.
- Whitelist **MUST** align with the **screen id universe** in `docs/contract.md` (화면 기반 접근 제어 — 화면 ID 목록), frontend **`ALLOWED_SCREEN_IDS`** / ordered screen lists, and permission-group screen matrices. The deployment **MAY** expose a **subset** of screens as label-configurable; any id not in that subset is still “unknown” for write and **MUST** be rejected.

**Reference list (contract — not necessarily all label-configurable in v1):**

`main`, `pb-feplog`, `pb-fep-log-search`, `java-fw-imagelog`, `search-history`, `activity-log`, `statistics`, `pending-approvals`, `user-management`, `department-approvers`, `user-permission-hierarchy`, `permission-group-management`

# 2.1 parentGroupId allowlist (closed set)

- Values **MUST** match **`MENU_TREE` top-level `id`** in `frontend/src/constants/menuTree.js` (not free-form).
- **Allowed literals** (string, exact):

  - `log-search`
  - `history`
  - `statistics`
  - `admin`

- Any other string (including unknown tokens) on write → **400** with **`code`: `INVALID_INPUT`** (implementation **MAY** use a dedicated `code` if it is added to `docs/contract.md` / `docs/api-definition.md` in the same release; otherwise **`INVALID_INPUT`** is canonical).
- **Omission** or **null** on read/write: client **MUST** apply **`MENU_TREE` default** parent group for that `screenId` when building the presentation tree.

# 3. Data shapes (JSON)

Naming follows existing API style (`docs/api-definition.md` §1 — camelCase in `data`).

## 3.1 ScreenDisplayLabelItem

| Field | Type | Required | Description |
|-------|------|----------|-------------|
| screenId | string | Yes | Stable screen key (same as `currentView` / permission `screen_id`). |
| labelUser | string | Yes | Plain text shown to end users (menu, primary chrome). No HTML. |
| labelAdmin | string | No | Optional admin-only note (e.g. internal version hint); omit or null if not set. |
| parentGroupId | string | No | Top-level sidebar group id; **one of** §2.1 allowlist. Omit or null → use **`MENU_TREE`** default for this `screenId`. |
| sortOrder | integer | No | Non-negative integer: order **within the same effective parent group**; **lower = higher** in the sidebar. Omit or null → use **`MENU_TREE`** default order. **Tie-break**: when two leaves share the same effective `sortOrder`, sort by **`screenId` ascending (lexicographic)**. |

**Max length (contract default; DB may use VARCHAR of same size):**

- `labelUser`: **256** characters (UTF-8 code units / Java string length per product alignment).
- `labelAdmin`: **256** characters.

Exceeding max length → **400** `INVALID_INPUT`. Empty or whitespace-only `labelUser` where a value is required → **400** `INVALID_INPUT`.

**Validation (PUT/PATCH):**

- `parentGroupId`: if present and not null, **MUST** be one of §2.1; else **400** `INVALID_INPUT`.
- `sortOrder`: if present and not null, **MUST** be a **non-negative integer**; negative or non-integer → **400** `INVALID_INPUT`.

## 3.2 GET success body

**Option A (preferred for list consumers):**

```json
{
  "success": true,
  "data": [
    {
      "screenId": "pb-feplog",
      "labelUser": "PB FEP 로그 검색",
      "labelAdmin": "legacy v1",
      "parentGroupId": "log-search",
      "sortOrder": 0
    },
    {
      "screenId": "pb-fep-log-search",
      "labelUser": "PB FEP 로그 검색(와이어프레임)",
      "parentGroupId": "log-search",
      "sortOrder": 1
    },
    {
      "screenId": "activity-log",
      "labelUser": "활동 이력",
      "parentGroupId": "history",
      "sortOrder": 2
    }
  ]
}
```

Fields **`parentGroupId`** and **`sortOrder`** **MAY** be omitted or **null** per item when not persisted; clients then use **`MENU_TREE`** defaults for that screen.

**Option B (map by screenId):** `data` MAY be `Record<string, { labelUser, labelAdmin?, parentGroupId?, sortOrder? }>` if implementation prefers O(1) lookup; document the chosen shape in release notes and keep Frontend in sync.

# 4. Endpoints

## 4.1 GET /api/screen-display-labels

| Item | Definition |
|------|------------|
| **Method** | GET |
| **Path** | `/api/screen-display-labels` |
| **Auth** | Required — same session cookie model as `GET /api/auth/me` (unauthenticated **401**). |
| **Success** | **200** — `success: true`, `data` per §3.2. Each element **MAY** include **`parentGroupId`** and **`sortOrder`** when stored. |
| **Errors** | **401** — not logged in; response body uses common wrapper with `code` e.g. `UNAUTHORIZED` (align with `docs/api-definition.md`). |

**Note:** This endpoint does **not** replace screen-access checks; it only returns label and presentation metadata. The UI still hides or shows menu entries per `allowedScreenIds` / routing.

## 4.2 PUT /api/screen-display-labels or PATCH /api/screen-display-labels

| Item | Definition |
|------|------------|
| **Method** | PUT **or** PATCH (pick one canonical method in implementation; same request body). |
| **Path** | `/api/screen-display-labels` |
| **Auth** | Required. **Authorization**: **`is_system_admin === true`** only. Others → **403** `FORBIDDEN`. |
| **Request body** | JSON object: `{ "labels": [ ScreenDisplayLabelItem, ... ] }` — at least zero items (empty array: no-op; **400** if product forbids empty — default: allow no-op). Each item follows §3.1: **`screenId`** and **`labelUser`** required; **`labelAdmin`**, **`parentGroupId`**, **`sortOrder`** optional. Semantics for “omit vs null” on optional fields (no-op vs reset to default) are implementation-defined; **MUST** be documented in Step 4 and stay consistent with GET. |

**Success:** **200** — `success: true`; `data` MAY return updated snapshot (same shape as GET) or a minimal ack — implementation choice, document in Step 4.

**Errors:**

| HTTP | code | When |
|------|------|------|
| 400 | INVALID_SCREEN_ID | Any `screenId` not in server whitelist / not label-configurable. |
| 400 | INVALID_INPUT | Length, blank label, illegal characters; **unknown or invalid `parentGroupId`**; **`sortOrder` negative or not a non-negative integer**. |
| 401 | UNAUTHORIZED (or equivalent) | No session. |
| 403 | FORBIDDEN | Authenticated but not system admin. |

**Audit:** Persist actor, timestamp, and changed fields (labels and/or parent/order) per project audit (`user_activity_log` or equivalent) — detail in Backend/DB Step 4.

# 5. Frontend merge and ordering (normative for clients)

1. **Effective parent**: For each configurable leaf, use API **`parentGroupId`** when present and non-null; otherwise use **`MENU_TREE`** default for that `screenId`.
2. **Effective order**: Within each effective parent group, sort leaves by **`sortOrder` ascending**, then by **`screenId` ascending** if tied.
3. Apply existing **permission** and **admin-only** leaf rules **after** structure is computed (unchanged from permission-group behavior).

**Fallback summary:** If GET fails, **keep** built-in defaults from `menuTree.js` / `App.js`; do not block login.

