# 1. Purpose

- Authenticated users whose login path uses **local table-backed** credentials (`auth.login.mode=local`, `password_hash` verification on login) **MAY** change **their own** password via **`POST /api/auth/me/password`**.
- When **`auth.login.mode=ad`**, this endpoint **MUST NOT** mutate directory or application passwords for end users; callers receive **403** with **`ApiResponse.code`: `PASSWORD_CHANGE_NOT_ALLOWED`** (normative).
- **Hybrid / external-link users** (if present): behavior **SHOULD** align with whether the session was established via local password vs directory-only — **TODO** product/backend; until clarified, **403** `PASSWORD_CHANGE_NOT_ALLOWED` **MAY** be used when there is **no** usable local `password_hash` for self-service change (DOC-CODE-SYNC).

# 2. POST /api/auth/me/password

**Path**: `/api/auth/me/password`  
**Method**: **POST**  
**Content-Type**: `application/json`  
**Auth**: Valid session required. Operates on **`app_user.id`** from the current session (**self** only). No admin-on-behalf via this API.

## 2.1 Request body (JSON, camelCase)

| Field | Type | Required | Description |
|-------|------|----------|-------------|
| **currentPassword** | string | Yes | Current password (plaintext in transit over HTTPS only). |
| **newPassword** | string | Yes | New password (plaintext in transit). **Server stores only a strong one-way hash** (e.g. BCrypt); never logs cleartext. |
| **confirmNewPassword** | string | Yes | Must match **`newPassword`** after trim; server rejects mismatch (**400** `INVALID_INPUT`). |

## 2.2 Success

- **HTTP**: **200**
- **Envelope**: common **`ApiResponse`**: `success: true`, **`data`**: **`null`** (or empty object `{}` if implementation prefers — **DOC-CODE-SYNC**).
- **Password policy** (min length, complexity, history): **TODO** requirement TODO-01; until specified, server **SHOULD** enforce at least **non-blank** `newPassword` after trim; stricter rules **MUST** be documented in the same release in `docs/api-definition.md` / this spec.

## 2.3 Session after success

- Whether the server **invalidates the current session** or **keeps it** after a successful change is **implementation-defined**; **both are contract-allowed**. Implementations **MUST** document actual behavior in `docs/api-definition.md` (DOC-CODE-SYNC) when Step 4 completes.

## 2.4 Errors (`ApiResponse`)

| HTTP | code | When |
|------|------|------|
| 401 | `UNAUTHORIZED` (or project-standard equivalent) | Missing or invalid session. |
| **403** | **`PASSWORD_CHANGE_NOT_ALLOWED`** | **`auth.login.mode` is `ad`**, or deployment policy denies local self-service password change for this user (e.g. no local hash). |
| 400 | `INVALID_INPUT` | Missing/blank fields after trim; **`confirmNewPassword` ≠ `newPassword`** after trim; **`newPassword` fails product password policy** when defined. |
| 400 | **`INVALID_CREDENTIALS`** | **`currentPassword` does not match** stored hash. Use **generic** `error` / `message` text where appropriate to reduce user enumeration (align with login error messaging family). |

- **Rate limiting**: optional; if added, document HTTP/`code` in the same release (requirement TODO-08).

# 3. Zero-permission authenticated session

Same family as `specs/external-identity-auth.spec.yaml` §5: users who are **authenticated** but have **no** `allowedScreenIds` **SHOULD** still be allowed to call **`POST /api/auth/me/password`** when **`auth.login.mode=local`**, so they can complete onboarding from **My page** without business-screen access. **AD mode** remains **403** `PASSWORD_CHANGE_NOT_ALLOWED` as above.

# 4. Profile read-only fields (UI contract)

- **Department** and **display name** on My page are **read-only**; authoritative payload continues to be **`GET /api/auth/me`** (`selfContext` and related fields) — no new profile-update fields in this spec.
