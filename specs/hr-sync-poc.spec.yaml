## 4.6 GET /api/hr-sync/poc/user-mgmt/replica-users

**Purpose**: Paginated **replica employee** rows for PoC UM grid, from **`ext_employee`** with optional join **`ext_department`** for display names only. **Read-only** replica source; **never** joins to **`app_user`** for mutation.

**Query parameters**

| Param | Type | Default | Description |
|-------|------|---------|-------------|
| snapshotId | string | — | Optional. When present, restrict to rows whose replica snapshot column matches (same semantics as §4.4 / `ext_employee.snapshot_id`; DOC-CODE-SYNC column name). |
| departmentKey | string | — | Optional. Filter by external department key (same family as §4.4 `departmentKey` / tree `departmentKey`). |
| sourceSystem | string | `HR_SAMPLE` | Optional replica source filter when schema supports it (align with §4.5). |
| page | integer | 1 | 1-based page (≥ 1). |
| size | integer | 20 | Page size; **minimum 1**, **maximum 100**. |

**Success (200)**

Wrapper: standard `ApiResponse` with `success: true`.

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| snapshotId | string \| null | Echo when request included `snapshotId`; else null. |
| departmentKey | string \| null | Echo when filter applied; else null. |
| sourceSystem | string | Echo or resolved `sourceSystem`. |
| users | array | Rows shaped like §4.4 **`employees[]`** items: `displayName`, `jobTitle`, `departmentKey`, `departmentName`, `active`, optional `employeeNumber`. **Do not** include **email**. |
| pagination | object | `{ "currentPage": number, "totalPages": number, "totalCount": number }` |

**Errors**

| HTTP | code | When |
|------|------|------|
| 400 | VALIDATION_ERROR | Invalid `page`/`size` or **size > 100**. |
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Lacks **`user-management-v2-poc`**. |
| 404 | NOT_FOUND | When **`snapshotId`** is **present** and **unknown** or **no rows** for that snapshot in replica data (same contract choice as §4.4; DOC-CODE-SYNC). When `snapshotId` **omitted**, **do not** use 404 for “empty page”; return **200** with `users: []` and `totalCount: 0` if applicable. |

**Read-only guarantee**: **No** writes to **`app_user`**, permission grants, or production Tree.

