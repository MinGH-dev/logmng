## 4.5 GET /api/hr-sync/poc/user-mgmt/replica-departments/tree

**Purpose**: Return a **nested department tree** for PoC User Management UX, sourced **only** from replica **`ext_department`** (SELECT). Does **not** read or mutate production Tree / `department` authority tables.

**Query parameters**

| Param | Type | Default | Description |
|-------|------|---------|-------------|
| sourceSystem | string | `HR_SAMPLE` | Replica source system key (e.g. column `source_system` on `ext_department`; product aligns with sample/PoC seed). |

**Success (200)**

Wrapper: standard `ApiResponse` with `success: true`.

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| sourceSystem | string | Echo or resolved `sourceSystem` used for the query. |
| roots | array | Root nodes; each node matches **`ReplicaDepartmentTreeNode`** (see below). |

**`ReplicaDepartmentTreeNode`**

| Field | Type | Description |
|-------|------|-------------|
| departmentKey | string | Stable external department key (e.g. `external_department_id` or product‑defined code — DOC-CODE-SYNC to schema). |
| parentDepartmentKey | string \| null | Parent’s `departmentKey`; null for roots. |
| name | string \| null | Display name from replica (`ext_department.name` or mapped). |
| sortOrder | integer | Sort hint within siblings (≥ 0; default 0 if unknown). |
| children | array | Same shape, recursively (empty array if leaf). |

**Example** (abbreviated)

```json
{
  "success": true,
  "data": {
    "sourceSystem": "HR_SAMPLE",
    "roots": [
      {
        "departmentKey": "EXT-DEPT-ROOT",
        "parentDepartmentKey": null,
        "name": "Sample Org",
        "sortOrder": 0,
        "children": [
          {
            "departmentKey": "EXT-DEPT-001",
            "parentDepartmentKey": "EXT-DEPT-ROOT",
            "name": "Sample Dept A",
            "sortOrder": 10,
            "children": []
          }
        ]
      }
    ]
  }
}
```

**Errors**

| HTTP | code | When |
|------|------|------|
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Authenticated but lacks **`user-management-v2-poc`** (or equivalent). |
| 503 | — | Replica / DB failure while building tree (product error code DOC-CODE-SYNC; do not return empty tree as success if query failed). |

**Read-only guarantee**: **No** INSERT/UPDATE/DELETE on **`app_user`**, application permission tables, or production department Tree.

