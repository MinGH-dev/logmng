## 4.7 POST /api/hr-sync/poc/user-mgmt/actions/migrate-preview

**Purpose**: **Stub** for migration‑testing UX (e.g. “preview migrate” button). **Does not** persist anything to production identity stores.

**Normative side-effect guarantee**

- The handler **MUST NOT** perform **INSERT**, **UPDATE**, or **DELETE** on **`app_user`**.
- The handler **MUST NOT** mutate application **permission** / **screen** / **role** assignment tables or production **department Tree** authority.
- Optional request body (empty object or future fields) is allowed; validation is implementation-defined.

**Success (200)**

```json
{
  "success": true,
  "data": {
    "persisted": false,
    "messageCode": "POC_ACTION_NOT_PERSISTED"
  }
}
```

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| persisted | boolean | Always **`false`** for this stub. |
| messageCode | string | Always **`POC_ACTION_NOT_PERSISTED`**. |

**Errors**

| HTTP | code | When |
|------|------|------|
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Lacks **`user-management-v2-poc`**. |

**Audit**: This stub **MUST NOT** emit **`user_activity_log`** (or other production audit) entries that **imply** a real user or permission mutation. If product later requires PoC-only audit rows, that is a **separate** requirement.

---
# 5. Error codes (project `ApiResponse.code`)

| code | Typical HTTP | Meaning |
|------|----------------|---------|
| POC_DISABLED | 403 | `HR_SYNC_POC_ENABLED` false or PoC routes disabled. |
| SYNC_SOURCE_NOT_READY | 403 or 503 | Upstream not ready; may return placeholder preview policy until wired. |
| HR_SYNC_POC_PREVIEW_FAILED | 503 | Preview **`classificationCounts`** could not be computed (replica/DB failure); not used for legitimate zero-row snapshots (**200** + zeros). |
| VALIDATION_ERROR | 400 | Request validation failed (preview body, pagination, or `snapshotId` path validation). |
| NOT_FOUND | 404 | Unknown or empty **`snapshotId`** for §4.4 (contract choice; no 200 empty page). |
| POC_ACTION_NOT_PERSISTED | — | **Not an error code.** Returned in **successful** stub **`data.messageCode`** for §4.7 (`POST .../actions/migrate-preview`). |

Other codes (`UNAUTHORIZED`, `FORBIDDEN`, `FUNCTION_NOT_ALLOWED`) follow existing project patterns.

---
# 6. Classification keys

Keys in `classificationCounts` align with requirement §2 design:

- `TRANSFER` — department-change-only transfer bucket (revoke-first applies on **apply**, not on preview).
- `NEW_HIRE`, `RESIGNED`, `UNCHANGED`, `PROFILE_UPDATE_NON_SECURITY`, `CONFLICT`, `ORPHAN`.

All values are non-negative integers. Keys **SHOULD** all be present in JSON for stable clients; if omitted, clients may treat as `0` only if documented in DOC-CODE-SYNC.

---
# 7. Apply blocked in PoC

- Requirement **§2.6**: default **`PREVIEW_ONLY`**; **`HR_SYNC_POC_APPLY_ENABLED`** default off.
- **No `POST .../apply`** (or equivalent mutation) is defined in this PoC spec. When a future apply API exists:
  - It MUST be denied (**403** or route not registered) when apply is disabled or preview-only mode fails closed.
  - Scheduler/service-account bypass is forbidden per requirement.
- Servers MAY omit apply routes entirely in PoC builds; clients MUST NOT assume an apply URL exists.

