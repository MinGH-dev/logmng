## 4.2 POST /api/hr-sync/poc/preview

Run a **read-only** classification / impact summary for the given optional snapshot/ingest identifiers.

**Request body**

```json
{
  "snapshotId": "optional-snapshot-id",
  "ingestRunId": "optional-ingest-run-id"
}
```

| Field | Type | Required | Description |
|-------|------|----------|-------------|
| snapshotId | string | No | External HR snapshot identifier when available. |
| ingestRunId | string | No | Upstream ingest run identifier when available. |

Validation rules when upstream integration exists are **implementation-defined** and must be DOC-CODE-SYNC’d (e.g. both empty forbidden, or one required).

**Classification scope (`classificationCounts` vs `snapshotId`)**

- When the request body includes a **non-blank** `snapshotId`, **`classificationCounts` MUST be computed only from `ext_employee` rows whose `snapshot_id` equals that value** (exact column name per schema / replica DDL; DOC-CODE-SYNC). Multi-snapshot PoC data MUST NOT be merged into this aggregate.
- When **`snapshotId` is omitted, null, or treated as absent per product validation (e.g. blank string normalized to absent)**, **`classificationCounts` remain the PoC global stub**: an **unscoped** aggregate over replica `ext_employee` (e.g. whole-table or product-defined stub mapping), **not** restricted to a single snapshot. Clients that need snapshot-scoped counts SHOULD send `snapshotId`.

**Legitimate empty snapshot vs errors**

- If `snapshotId` is present and valid but **there are zero** matching `ext_employee` rows, respond **200** **`success: true`** with **`classificationCounts` all zero** (every key `0`). This is **legitimate empty**, **not** **404** — preview contract differs from §4.4 personnel list (which may use **404** for unknown/empty snapshot per that section).
- If counting **fails** due to **replica/DB error** (e.g. SQL exception, connection failure), the server MUST **not** return **200** with all-zero counts as a silent substitute. Respond per **Errors** below (**`HR_SYNC_POC_PREVIEW_FAILED`**).

**Success (200)**

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| previewId | string | Server-issued preview artifact id (for future apply linkage; apply not in this spec’s minimal PoC). |
| snapshotId | string | Echo or resolved snapshot id used for the preview. |
| classificationCounts | object | Counts per classification key (integers ≥ 0). |
| classificationCounts.TRANSFER | number | Department-driven transfer bucket. |
| classificationCounts.NEW_HIRE | number | |
| classificationCounts.RESIGNED | number | |
| classificationCounts.UNCHANGED | number | |
| classificationCounts.PROFILE_UPDATE_NON_SECURITY | number | |
| classificationCounts.CONFLICT | number | |
| classificationCounts.ORPHAN | number | |
| riskTier | string | e.g. `AUTO`, `CONDITIONAL`, `APPROVAL_REQUIRED`, or placeholder until policy engine wired. |
| upstreamGateStatus | string | Upstream completion/manifest gate status; until integrated use placeholder such as `NOT_READY` or `PLACEHOLDER`. |
| messageCode | string | Safe machine-readable hint for UI (no secrets). |

**Example**

```json
{
  "success": true,
  "data": {
    "previewId": "poc-preview-01HZX8QVKM3TP9V6WGRYZK7FX4",
    "snapshotId": "snap-2026-04-08T00:00:00Z",
    "classificationCounts": {
      "TRANSFER": 2,
      "NEW_HIRE": 1,
      "RESIGNED": 0,
      "UNCHANGED": 40,
      "PROFILE_UPDATE_NON_SECURITY": 3,
      "CONFLICT": 0,
      "ORPHAN": 0
    },
    "riskTier": "APPROVAL_REQUIRED",
    "upstreamGateStatus": "PLACEHOLDER",
    "messageCode": "HR_SYNC_POC_PREVIEW_OK"
  }
}
```

**Errors**

| HTTP | code | When |
|------|------|------|
| 400 | VALIDATION_ERROR | Invalid body; missing required ids when rules demand them; bad types. |
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off. |
| 403 / 503 | SYNC_SOURCE_NOT_READY | Upstream ingest/manifest/completion not available or not validated; **placeholder** behavior allowed until integration (DOC-CODE-SYNC HTTP choice). |
| 503 | HR_SYNC_POC_PREVIEW_FAILED | **Preview aggregation failed** (replica/DB error, timeout, or other failure while computing `classificationCounts`). Do **not** mask as **200** + all-zero counts. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Authenticated but not authorized for PoC preview (implementation aligns with permission model). |

**Read-only guarantee**

- Implementations MUST NOT persist preview results into `app_user`, permission-grant tables, or production Tree mutations as part of this endpoint’s handling. Optional **PoC-isolated** audit/storage is out of scope for this minimal spec unless added in a later version with explicit schema.

