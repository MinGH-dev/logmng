# 1. Purpose

- Provide a **zero-impact** Proof-of-Concept surface for HR-driven user sync: **preview/classification only**.
- Default product mode is **`PREVIEW_ONLY`**; mutation/apply to `app_user`, application permission stores, or production Tree authority is **out of scope** for `POST .../preview`.
- Behavior is governed by flags such as **`HR_SYNC_POC_ENABLED`**, **`HR_SYNC_POC_DEFAULT_MODE`**, **`HR_SYNC_POC_APPLY_ENABLED`** (exact property/env names are backend configuration; semantics below).

---
# 2. Non-goals (PoC contract)

- **No writes** from `POST /api/hr-sync/poc/preview` to:
  - `app_user` (or equivalent user table),
  - permission / role assignment tables used for runtime authorization,
  - production Tree / department authority of record.
- **Apply execution** (batch commit, revoke-first transfer, resigned lifecycle, etc.) is **blocked** in PoC unless an explicitly approved, time-bounded apply gate is satisfied — see §7. This spec documents **config + preview** only for Step 3/4 PoC trajectory.

---
# 3. Authorization model (outline)

- All routes under `/api/hr-sync/poc` require an **authenticated session** unless backend explicitly documents a narrower exception (none expected for PoC).
- Fine-grained role/screen mapping (e.g. dedicated PoC preview role per requirement `HR_SYNC_POC_ROLE_REQUIRED_FOR_PREVIEW`) is **product implementation**; denied callers receive **403** with a project `code` (e.g. `FORBIDDEN`, `FUNCTION_NOT_ALLOWED`, or `POC_DISABLED` when the whole surface is off).
- When **`HR_SYNC_POC_ENABLED`** is false: respond **403** with **`POC_DISABLED`** and/or **do not register** the routes (deployment choice); clients must not rely on one exclusive mechanism — either is valid if documented in release notes.

### 3.1 PoC User Management (UM v2 clone) — screen and session

- **Screen id**: **`user-management-v2-poc`** (distinct from production **`user-management-v2`**; permission assignment is independent).
- **Route prefix**: `/api/hr-sync/poc/user-mgmt`
- **Mirrors other PoC APIs** for the global gate:
  - Valid session required; unauthenticated → **401** `UNAUTHORIZED` (or project-equivalent).
  - When **`HR_SYNC_POC_ENABLED`** is false: **403** **`POC_DISABLED`** (and/or routes not registered — same family as §3).
- **Screen access**: Caller must have **`user-management-v2-poc`** in **`allowedScreenIds`** (or **`is_system_admin=true`** per project rules). Otherwise **403** with **`FORBIDDEN`** / **`FUNCTION_NOT_ALLOWED`** (align with `ScreenAccessInterceptor` / permission patterns; DOC-CODE-SYNC).
- **UI feature flag**: Frontend may additionally hide the menu when **`REACT_APP_HR_SYNC_POC_UI`** (or successor) is false; API contract remains server‑authoritative for **`HR_SYNC_POC_ENABLED`** and screen permission.

