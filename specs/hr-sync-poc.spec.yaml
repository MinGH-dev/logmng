## 4.3 GET /api/hr-sync/poc/snapshots

Return **distinct PoC snapshot identifiers** available in replica data (e.g. `ext_employee.snapshot_id` non-null cohorts), plus **minimal metadata** for UI selection. **Read-only**; no writes to `app_user`, permission tables, or production Tree.

**Query parameters**

None.

**Success (200)**

Wrapper: standard `ApiResponse` with `success: true`.

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| snapshots | array | Snapshot list items (see below). Order: stable for a given DB state (e.g. `snapshotId` ascending). |

**`snapshots[]` item**

| Field | Type | Description |
|-------|------|-------------|
| snapshotId | string | Logical snapshot / extract batch id for PoC (e.g. `poc-snap-20260408-A`). |
| label | string \| null | Optional human-readable label; may be null if not stored. |
| employeeCount | integer | Count of `ext_employee` rows in this snapshot (≥ 0). |
| maxImportedAt | string \| null | Optional ISO-8601 timestamp: max `imported_at` (or equivalent) in that snapshot; null if column unused or all null. |

**Example**

```json
{
  "success": true,
  "data": {
    "snapshots": [
      {
        "snapshotId": "poc-snap-20260408-A",
        "label": "PoC sample A",
        "employeeCount": 3,
        "maxImportedAt": "2026-04-08T02:00:00Z"
      },
      {
        "snapshotId": "poc-snap-20260408-B",
        "label": "PoC sample B",
        "employeeCount": 2,
        "maxImportedAt": "2026-04-08T02:00:05Z"
      }
    ]
  }
}
```

**Errors**

| HTTP | code | When |
|------|------|------|
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off or route disabled. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Authenticated but not allowed for PoC snapshot/personnel (same class as preview; screen access aligned). |

**Data minimization**: Do not return upstream secrets, raw manifest payloads, or per-row replica dumps. This endpoint returns **aggregate list metadata** only.

