# 4. APIs

## 4.1 GET /api/hr-sync/poc/config

Expose **non-secret** PoC configuration for UI gating.

**Success (200)**

Wrapper: standard `ApiResponse` with `success: true`.

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| pocEnabled | boolean | True when `HR_SYNC_POC_ENABLED` (or equivalent) is on. |
| defaultMode | string | Default mode; product default **`PREVIEW_ONLY`**. |
| applyEnabled | boolean | Reflects `HR_SYNC_POC_APPLY_ENABLED`; **does not** grant the right to call a future apply API — additional gates apply per requirement §2.6. |

**Example**

```json
{
  "success": true,
  "data": {
    "pocEnabled": true,
    "defaultMode": "PREVIEW_ONLY",
    "applyEnabled": false
  }
}
```

**Errors**

| HTTP | code | When |
|------|------|------|
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off or route disabled. |

**Security**: Do **not** return manifest digests, HMAC secrets, upstream credentials, or raw PII payloads.

