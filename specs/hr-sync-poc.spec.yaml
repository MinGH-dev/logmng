## 4.4 GET /api/hr-sync/poc/snapshots/{snapshotId}/employees

Return a **bounded, paginated** page of **minimal personnel DTOs** for replica employees in `snapshotId`. Source: **`ext_employee`** (optional join `ext_department` for display name only). **Read-only**; no writes to `app_user` or permission tables.

**Path parameters**

| Param | Type | Description |
|-------|------|-------------|
| snapshotId | string | Snapshot id; must match server validation (length ≤ **128**, allowed charset: alphanumeric, hyphen, underscore, dot per product regex; **DOC-CODE-SYNC** exact pattern). |

**Query parameters**

| Param | Type | Default | Description |
|-------|------|---------|-------------|
| page | integer | 1 | 1-based page index (≥ 1). |
| size | integer | 20 | Page size; **minimum 1**, **maximum 100** (product cap; exceed → see Errors). |

Alternative names `page` / `pageSize` are **not** part of this contract unless DOC-CODE-SYNC’d to a single canonical pair project-wide.

**Success (200)**

Wrapper: standard `ApiResponse` with `success: true`.

**`data` schema**

| Field | Type | Description |
|-------|------|-------------|
| snapshotId | string | Echo of resolved `snapshotId`. |
| employees | array | Personnel rows for this page (see below). |
| pagination | object | `{ "currentPage": number, "totalPages": number, "totalCount": number }` — same family as list/search APIs. |

**`employees[]` item (minimal fields — §2.1 alignment)**

Expose **only** fields needed for the PoC personnel table. Do **not** return **email** in PoC responses. Do **not** return raw replica-only columns beyond this list.

| Field | Type | Description |
|-------|------|-------------|
| displayName | string \| null | Display name for the row (e.g. `ext_employee.display_name`). |
| jobTitle | string \| null | Job / title (e.g. `ext_employee.job_title` or mapped column). |
| departmentKey | string \| null | **External** department key for UI linkage (e.g. `external_department_id` or stable `ext_department` code — implementation maps from schema; not `app_user` / internal Tree id). |
| departmentName | string \| null | Optional display name from `ext_department` join when available. |
| active | boolean | Employment / active flag suitable for demo (e.g. from `ext_employee` active/resign semantics). |
| employeeNumber | string \| null | **Optional**; if present, **full** `ext_employee.employee_number` for PoC (no masking). |

**Example**

```json
{
  "success": true,
  "data": {
    "snapshotId": "poc-snap-20260408-A",
    "employees": [
      {
        "displayName": "Sample User One",
        "jobTitle": "Analyst",
        "departmentKey": "EXT-DEPT-001",
        "departmentName": "Sample Dept A",
        "active": true,
        "employeeNumber": "12345678"
      }
    ],
    "pagination": {
      "currentPage": 1,
      "totalPages": 1,
      "totalCount": 3
    }
  }
}
```

**Errors**

| HTTP | code | When |
|------|------|------|
| 400 | VALIDATION_ERROR | Invalid `snapshotId` format; `page` < 1; `size` < 1 or **size > 100** (or cap mismatch — DOC-CODE-SYNC single cap). |
| 401 | UNAUTHORIZED | No valid session. |
| 403 | POC_DISABLED | PoC feature off. |
| 403 | FORBIDDEN / FUNCTION_NOT_ALLOWED | Authenticated but not allowed for PoC personnel list. |
| 404 | NOT_FOUND | **No replica rows** for `snapshotId` (unknown or empty snapshot). |

**Unknown snapshot contract**: Requirement allows **404** vs **200 + empty `employees`**. This spec chooses **404** with **`code`: `NOT_FOUND`** when the snapshot id is not present in replica data (TC-04).

**Read-only guarantee**: Same as §4.2 — no mutations to `app_user`, permission grants, or production Tree.

