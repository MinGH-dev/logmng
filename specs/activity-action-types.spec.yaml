## 2.7 Planned — in-app copy & access-audit evidence (req `20260330-audit-evidence-activity-log-conservative`)

Conservative defaults: **in-app selection/copy only** (no OS-wide clipboard). Payloads are **truncated** server-side with **`was_truncated`**; full body view is **privileged** and **must** append an access-audit record (see `specs/activity-log-audit-evidence.spec.yaml`).

| code | labelKo (hint) | Notes |
|------|----------------|--------|
| `IN_APP_COPY` | 인앱 복사 | **provisional label** — in-app copy event; `action_detail.copyPayload` shape in activity-log-audit-evidence spec §4 |
| `ACCESS_AUDIT_VIEW` | 접근 감사(민감 상세 열람) | **Use only if** implementation stores access-audit rows in **`user_activity_log`** with a dedicated type; if a **separate table** is used, this code may be omitted and audit rows are not activity-log “actions”. |

