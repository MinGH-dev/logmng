# 5. Statistics bucketing (informative; OP-02)

- **Not a contract for KPI formulas** — product confirms whether new admin types appear in charts.
- Existing SQL maps `LOGIN`, `SEARCH`/`ADVANCED_SEARCH`/`STATS_VIEW`, `DECRYPT` to daily aggregates; new types default to **visible in activity-log list** and **may be excluded** from legacy KPI buckets until product extends aggregation.

