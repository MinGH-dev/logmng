## 2.4 User & org admin (auditable mutations)

| code | labelKo (hint) | Notes |
|------|----------------|--------|
| `USER_CREATE` | 사용자 생성 | Emit on successful **`POST /api/provisioning/users/from-external-employee`** and on **`POST /api/user-management-v2/users/direct`** (req `20260407-…`, `20260408-user-management-v2-activity-audit-detail-in-activity-log`). **Discriminate** v2 direct vs HR provisioning in `action_detail` — see §2.8 and §3 **user_admin** (`registrationSource`). |
| `USER_UPDATE` | 사용자 수정 | **Profile / admin field updates** on an existing `app_user` only. **Do not** use this code for: manual department tree mutations (use **`DEPARTMENT_*`** in §2.8), permission-group membership changes (use **`ASSIGN_USER_TO_PERMISSION_GROUP`** / **`UNASSIGN_USER_FROM_PERMISSION_GROUP`**), or provisioning/direct registration (use **`USER_CREATE`** with discriminant). Excludes passwords/tokens in `action_detail`. |
| `USER_DELETE` | 사용자 삭제 | Emit on successful **`DELETE /api/users/{userId}`** with required body `changeReason` (req `20260407-user-management-consistency-delete-reason-activity-audit`). `action_detail` §3. |
| `DEPARTMENT_APPROVER_UPDATE` | 부서 결재자 변경 | department approver screens / APIs |
| `SCREEN_DISPLAY_LABELS_UPDATE` | 화면 표시 라벨 변경 | PUT `/api/screen-display-labels` (req 20260406-menu-display-names-admin); `@ActivityLog` includeParams=false |

