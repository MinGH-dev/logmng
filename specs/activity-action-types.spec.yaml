## 2.7 Planned — in-app copy & access-audit evidence (req `20260330-audit-evidence-activity-log-conservative`)

Conservative defaults: **in-app selection/copy only** (no OS-wide clipboard). Payloads are **truncated** server-side with **`was_truncated`**; full body view is **privileged** and **must** append an access-audit record (see `specs/activity-log-audit-evidence.spec.yaml`).

| code | labelKo (hint) | Notes |
|------|----------------|--------|
| `IN_APP_COPY` | 인앱 복사 | **provisional label** — in-app copy event; `action_detail.copyPayload` shape in activity-log-audit-evidence spec §4 |
| `ACCESS_AUDIT_VIEW` | 접근 감사(민감 상세 열람) | **Use only if** implementation stores access-audit rows in **`user_activity_log`** with a dedicated type; if a **separate table** is used, this code may be omitted and audit rows are not activity-log “actions”. |

## 2.8 User Management v2 — department tree and direct registration (req `20260408-user-management-v2-activity-audit-detail-in-activity-log`)

**Filter UX**: One **distinct `action_type` per filterable operation** (not a single `DEPARTMENT_CREATE` with an internal enum) so activity-log **`actionType`** matches reviewer expectations.

| code | labelKo (hint) | Emit when (contract) |
|------|----------------|---------------------|
| `DEPARTMENT_CREATE_ROOT` | 부서 생성(최상위) | Successful **`POST /api/user-management-v2/departments/root`** |
| `DEPARTMENT_CREATE_CHILD` | 부서 생성(하위) | Successful **`POST /api/user-management-v2/departments/{parentDepartmentId}/children`** |
| `DEPARTMENT_UPDATE` | 부서 수정 | Successful department **update** mutation **when** that API is in contract (placeholder until path exists; do not log as `USER_UPDATE`). |
| `DEPARTMENT_DELETE` | 부서 삭제 | Successful **`DELETE /api/user-management-v2/departments/{departmentId}`** (JSON body **`changeReason`** required); `action_detail` §3 **department_admin**. Spec: `specs/user-management-v2.spec.yaml` §4.3. |

**Direct user registration (v2)**: Reuse **`USER_CREATE`** (no separate `USER_CREATE_DIRECT` in contract unless product explicitly splits later). Persist **`action_detail`** per §3 **user_admin** and set **`registrationSource`**: **`USER_MANAGEMENT_V2_DIRECT`**. HR / external-employee provisioning success continues to use **`USER_CREATE`** with **`registrationSource`**: **`EXTERNAL_PROVISIONING`** (or omit only where legacy rows predate the field — new emits SHOULD set the discriminant).

**`GET /api/activity-log/action-types`**: MUST include **§2.8** codes that the backend emits (same rule as §4.3 for user lifecycle types).

