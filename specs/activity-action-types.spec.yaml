# 3. `action_detail` shapes (high level — no secrets)

JSON object stored in `user_activity_log.action_detail`. Implementations **must not** store passwords, tokens, session identifiers, or decrypted payload content.

| Category | Typical keys (examples) | Forbidden |
|----------|------------------------|-----------|
| **auth** | method, outcome (success/failure without secrets) | password, token |
| **log_search** | `logType`, screen id, row identifiers as already used for audit | full request/response bodies with PII unless policy allows |
| **permission_group** | **`permissionGroupAuditV1`** (see `specs/activity-permission-group-audit.spec.yaml`): `before`/`after` snapshots, nested `allowedScreens` (`AllowedScreenItem`), optional `changeReason` (max 500, provisional). Legacy flat keys may coexist during transition. | raw JWT, encryption keys, denylist keys in §6 of that spec |
| **user_assignment** | `targetUserId` (numeric `app_user.id`), `permissionGroupId` | — |
| **user_admin** | **User lifecycle (req `20260407-user-management-consistency-delete-reason-activity-audit`, `20260408-user-management-v2-activity-audit-detail-in-activity-log`)** — flat `action_detail` for **`USER_CREATE`** / **`USER_DELETE`**: **`changeReason`** (string, required when the mutation API requires it; persisted max **500** chars, align MF-03 / `permissionGroupAuditV1.changeReason`), **`targetUserId`** (number, numeric `app_user.id` — required after create/delete target is known), optional **`employeeNumber`** (string), optional **`username`** (string), optional **`name`** (string, display name for v2 direct create — **omit or truncate** if Security/product policy requires), optional **`departmentId`** / **`departmentCode`** (string, target department code when relevant), optional **`rank`** (string), optional **`permissionGroupId`** (number). For **`USER_CREATE`** only: **`registrationSource`** (string enum) — **`EXTERNAL_PROVISIONING`** \| **`USER_MANAGEMENT_V2_DIRECT`** — **required for new rows** so filters and reviewers distinguish HR provisioning from v2 direct registration. Same denylist as permission_group / §6: no passwords, tokens, session ids, raw request bodies, decrypted content. | password hash, temp password, directory password, refresh tokens |
| **department_admin** | **Department tree mutations (v2)** — flat object for **`DEPARTMENT_CREATE_ROOT`**, **`DEPARTMENT_CREATE_CHILD`**, and when implemented **`DEPARTMENT_UPDATE`** / **`DEPARTMENT_DELETE`**: **`changeReason`** (string, required when API requires it; max **500**), **`departmentCode`** (string, created or target code), **`parentDepartmentCode`** (string \| **null**, null for root create), optional **`name`** (string), optional **`sortOrder`** (number). For updates, optional **`before`** / **`after`** snapshots obey **mutation_before_after** (allowlisted keys only). Same §6 denylist. | passwords, tokens, full raw request body |
| **department_approver** | `departmentCode`, optional approver `userId` references | — |
| **decrypt_approval** | `searchHistoryId`, `decision` (approve/reject) | decrypted content |
| **in_app_copy** | **`copyPayload`** (see `specs/activity-log-audit-evidence.spec.yaml` §4): truncated selection text, **`was_truncated`**, length/count; never secrets | full unredacted body in stored JSON for non-privileged views — use truncation + privileged reveal API |
| **delete_snapshot** | **`deleteSnapshot`**: allowlisted keys + resource ids only (req §2) | full entity secrets, credentials |
| **mutation_before_after** | **`before`**, **`after`** objects with **allowlisted** keys only for updated fields | secret plaintext; use mask/hash/omit per field class |

Exact key names are implementation details; Contract requires **category-appropriate, non-sensitive** content only. Full JSON shapes for copy/delete/before-after **views** (masked vs revealed) are owned by **`specs/activity-log-audit-evidence.spec.yaml`**.

