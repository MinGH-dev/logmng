# 4. Optional API — filter dropdown options

## 4.1 Endpoint

| Method | Path | Description |
|--------|------|-------------|
| GET | /api/activity-log/action-types | Returns canonical `{ code, label }[]` for the activity-type filter on **activity-log**. |

**Alternate path (equivalent semantics)** if implementation prefers the shared `filter-options` family: `GET /api/filter-options/activity-action-types`. **Contract canonical path**: **`GET /api/activity-log/action-types`** (first choice in requirement §2).

## 4.2 Auth / access

- **401** if unauthenticated.
- **403** `FORBIDDEN` if the user lacks **activity-log** screen access (`read`), same family as `POST /api/activity-log/search` and `GET /api/filter-options/departments?screen=activity-log`.
- **is_system_admin**: same rules as other activity-log APIs (full access when admin).

## 4.3 Response

**200** — `ApiResponse` wrapper; **data**:

```ts
type ActivityActionTypeOption = {
  code: string;   // e.g. "LOGIN" — matches action_type / actionType filter
  label: string;  // Korean (or product locale) display string for UI
};

type ActivityActionTypesResponse = ActivityActionTypeOption[];
```

- Sort: **`code` ascending** unless product specifies locale-aware sort by `label` (document in release notes if changed).
- Include **all** codes from §2 that the product surfaces in the filter (may exclude `UNKNOWN` from dropdown if product prefers). When user lifecycle audit is implemented, **`GET /api/activity-log/action-types`** MUST include **`USER_DELETE`** and **`USER_CREATE`** (req `20260407-user-management-consistency-delete-reason-activity-audit`, TC-11).
- **Empty `actionType`** in search means “all types” (unchanged).
- When User Management v2 audit is implemented, **`GET /api/activity-log/action-types`** MUST include **`DEPARTMENT_CREATE_ROOT`**, **`DEPARTMENT_CREATE_CHILD`**, and any contracted **`DEPARTMENT_UPDATE`** / **`DEPARTMENT_DELETE`** (req `20260408-user-management-v2-activity-audit-detail-in-activity-log`, TC-05).

## 4.4 Errors

| Status | code | When |
|--------|------|------|
| 401 | — | Not logged in |
| 403 | FORBIDDEN | No activity-log access |

