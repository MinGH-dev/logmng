# 1. Storage and query

- **Column**: `user_activity_log.action_type` — `VARCHAR(50)` (see `schema_user_activity_log.sql`; extend via migration if a future code exceeds 50).
- **Search filter**: `POST /api/activity-log/search` request body **`actionType`** — optional; when set, exact match on `action_type` (existing behavior).
- **Scope**: Same as other activity-log APIs — `activity-log` screen + per-screen scope (`self` | `team` | `all`); see `specs/permission-group-hierarchy.spec.yaml` §4.3.

# 2. OP-01 — Canonical `action_type` codes (UPPER_SNAKE_CASE)

All values are **case-sensitive** strings. Labels (`labelKo`) are **display** hints for UI; authoritative copy may follow product wording.

## 2.1 Implemented today (emit from existing `@ActivityLog` or controllers)

| code | labelKo (hint) | Notes |
|------|----------------|--------|
| `LOGIN` | 로그인 | Auth |
| `LOGOUT` | 로그아웃 | Auth |
| `SEARCH` | 검색 | Log DB search |
| `VIEW` | 상세 조회 | Log detail |
| `DECRYPT` | 복호화 | Decrypt / decrypted view paths |
| `ADVANCED_SEARCH` | 고급 검색 | Advanced search |

## 2.2 Aspect fallback / generic (when `@ActivityLog(actionType="")` infers from method name)

| code | labelKo (hint) | Notes |
|------|----------------|--------|
| `EXPORT` | 내보내기 | Inferred name contains `export` |
| `STATS_VIEW` | 통계 조회 | Inferred name contains `stats`; also counted in search-like KPI bucket in `ActivityStatisticsService` |
| `SCHEMA_VIEW` | 스키마 조회 | Inferred name contains `schema` |
| `UNKNOWN` | 기타 | Fallback when no rule matches |

