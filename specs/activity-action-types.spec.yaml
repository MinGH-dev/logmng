# 5. Statistics bucketing (informative; OP-02)

- **Not a contract for KPI formulas** — product confirms whether new admin types appear in charts.
- Existing SQL maps `LOGIN`, `SEARCH`/`ADVANCED_SEARCH`/`STATS_VIEW`, `DECRYPT` to daily aggregates; new types default to **visible in activity-log list** and **may be excluded** from legacy KPI buckets until product extends aggregation.
- **`DECRYPT` in activity statistics** (req `20260408-activity-statistics-decrypt-unique-rows-per-day`): KPI fields **`totalDecrypts`** / per-day decrypt totals / per-user **`decryptCount`** aggregate **`user_activity_log`** rows with `action_type = DECRYPT` only (**not** `DECRYPT_APPROVAL_*` or approval tables). Counts use **distinct logical row keys per calendar day** (dedup key per log type per `docs/requirements/20260408-activity-statistics-decrypt-unique-rows-per-day.md` §2); **daily global** totals dedupe across users in scope, **per-user** breakdown dedupes within each user then sums days in range.

