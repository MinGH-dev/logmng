spring:
  application:
    name: logmng-backend
  
  # 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/logmng
    username: logmng
    password: logmng123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA 설정 (선택사항 - 현재는 사용하지 않음)
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  #   show-sql: false
  #   properties:
  #     hibernate:
  #       dialect: org.hibernate.dialect.PostgreSQLDialect
  #       format_sql: true
  
  # AOP 설정
  aop:
    auto: true
    proxy-target-class: true
  
  # Jackson 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss

# Server 설정
server:
  port: 9200
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Logging 설정
logging:
  level:
    root: INFO
    com.logmng: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Application 설정
app:
  name: Log Management System
  version: 1.0.0
  description: 로그 관리 시스템 백엔드 API
  cors:
    # 폐쇄망/별도 호스트: CORS_ALLOWED_ORIGINS=http://10.0.0.5:3001,http://192.168.1.10:3001 (쉼표 구분, UI 출처만)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  # PostgreSQL schema placement on primary JDBC (A). Unqualified app/PB SQL resolves via Hikari connection-init-sql (search_path).
  # Single-DB dev: keep defaults public,public.
  db:
    schema:
      sys: ${APP_DB_SCHEMA_SYS:public}
      pb: ${APP_DB_SCHEMA_PB:public}
      imagelog: ${APP_DB_SCHEMA_IMAGELOG:public}
  # Secondary JDBC (B) for ImageLog only. Omit url (or leave empty) to reuse primary pool — single-database dev fallback.
  datasource:
    imagelog:
      url: ${APP_DATASOURCE_IMAGELOG_URL:}
      username: ${APP_DATASOURCE_IMAGELOG_USERNAME:}
      password: ${APP_DATASOURCE_IMAGELOG_PASSWORD:}
      driver-class-name: ${APP_DATASOURCE_IMAGELOG_DRIVER:}
      # When url is set: fail application startup if ImageLog DB is unreachable (clear ops signal; TC-04).
      fail-fast: ${APP_DATASOURCE_IMAGELOG_FAIL_FAST:true}
      initialization-fail-timeout-ms: ${APP_DATASOURCE_IMAGELOG_INIT_FAIL_TIMEOUT_MS:30000}
  security:
    admin-id: admin
    admin-pw: admin123
    encryption-key: ${ENCRYPTION_KEY:12345678901234567890123456789012}
    authorized-ips: "127.0.0.1,localhost,0:0:0:0:0:0:0:1,::1"
  decryption:
    enabled: ${DECRYPTION_ENABLED:true}
    auto-decrypt-on-keyword-search: ${AUTO_DECRYPT_ON_KEYWORD_SEARCH:true}
    failure-handling: ${FAILURE_HANDLING:fallback} # skip, fallback, error

