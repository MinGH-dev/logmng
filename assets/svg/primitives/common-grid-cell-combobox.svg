<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 22" role="img" aria-label="Grid cell combobox with dropdown toggle primitive">
  <defs>
    <style>
      .input { fill: #ffffff; stroke: #bdbdbd; stroke-width: 1; }
      .toggle { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1; }
      .txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
      .chev { fill: #555555; }
    </style>
  </defs>
  <rect class="input" x="0" y="0" width="154" height="22" rx="2" id="grid-cell-combo-input"/>
  <text x="5" y="15" class="txt" id="grid-cell-combo-text">type or pick</text>
  <rect class="toggle" x="156" y="0" width="32" height="22" rx="2" id="grid-cell-combo-toggle"/>
  <path class="chev" d="M 168 7 L 176 14 L 160 14 Z" id="grid-cell-combo-chevron" aria-hidden="true"/>
</svg>

