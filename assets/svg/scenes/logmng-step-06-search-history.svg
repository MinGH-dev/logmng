<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Search history with common pagination bar" data-step="search-history">
  <defs>
    <style>
      .view-title { fill: #212121; font-family: "Noto Sans KR", "Roboto", system-ui, sans-serif; font-size: 24px; font-weight: 600; }

      .bg { fill: #f5f5f5; }
      .side { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .bar { fill: #1976d2; }
      .bart { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 14px; }
      .navg { fill: #616161; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .nav { fill: #424242; font-family: system-ui, sans-serif; font-size: 12px; }
      .navhi { fill: #1976d2; font-weight: 600; }
      .paper { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .hint { fill: #9e9e9e; font-family: system-ui, sans-serif; font-size: 11px; }
      .hdr-bg { fill: #fafafa; stroke: #e0e0e0; stroke-width: 1; }
      .hdr-txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
      .sort-icon { fill: #6c757d; font-size: 10px; }
      .sort-icon-active { fill: #1976d2; font-size: 11px; font-weight: 600; }
      .col-band { fill: #f6f8fb; }
      .col-band-alt { fill: #f1f4f8; }
      .row { fill: rgba(255, 255, 255, 0); stroke: #e3e8ef; stroke-width: 1; }
      .row-alt { fill: rgba(255, 255, 255, 0); stroke: #e3e8ef; stroke-width: 1; }
      .row-hover-demo { fill: #e8eef6; stroke: #e3e8ef; stroke-width: 1; }
      .pill { fill: #fff3e0; stroke: #ffb74d; stroke-width: 1; }
      .pill-txt { fill: #e65100; font-family: system-ui, sans-serif; font-size: 10px; }
      .pg-paper { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .pg-txt { fill: #616161; font-family: system-ui, sans-serif; font-size: 12px; }
      .pg-btn { fill: #ffffff; stroke: #bdbdbd; stroke-width: 1; }
      .pg-btn-txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
      .pg-active { fill: #1976d2; stroke: #1976d2; stroke-width: 1; }
      .pg-active-txt { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 11px; }
      .pg-disabled { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1; }
      .pg-disabled-txt { fill: #bdbdbd; font-family: system-ui, sans-serif; font-size: 11px; }
      .pg-divider { stroke: #e0e0e0; stroke-width: 1; }

    </style>
  </defs>
  <rect class="bg" width="1200" height="800" id="shell-bg"/>
  <rect class="side" x="0" y="0" width="240" height="800" id="shell-sidebar"/>
  <text x="16" y="140" class="navg" id="nav-group-history">이력·승인</text>
  <text x="24" y="166" class="nav nav" id="nav-activity">활동 이력</text>
  <text x="24" y="192" class="nav navhi" id="nav-search-hist">검색 이력</text>
  <text x="24" y="218" class="nav nav" id="nav-pending">복호화 승인 관리</text>
  <rect class="bar" x="240" y="0" width="960" height="56" id="shell-appbar"/>
  <text x="260" y="36" class="bart" id="appbar-title">로그 관리 시스템</text>
  <rect class="paper" x="264" y="80" width="912" height="688" rx="4" id="content-panel"/>
  <text x="288" y="122" class="view-title" id="view-title">검색 이력</text>
  <rect class="paper" x="288" y="140" width="864" height="52" rx="4" id="filter-area"/>
  <text x="300" y="172" class="hint" id="filter-hint">필터 (기간, 로그 유형, 상태)</text>
  <rect class="col-band" x="288" y="208" width="112" height="188" id="list-col-type"/>
  <rect class="col-band-alt" x="400" y="208" width="220" height="188" id="list-col-summary"/>
  <rect class="col-band" x="620" y="208" width="180" height="188" id="list-col-status"/>
  <rect class="col-band-alt" x="800" y="208" width="352" height="188" id="list-col-research"/>
  <rect class="hdr-bg" x="288" y="208" width="864" height="28" id="list-header"/>
  <text x="296" y="226" class="hdr-txt"><tspan>로그 유형</tspan><tspan class="sort-icon"> ↕</tspan></text>
  <text x="400" y="226" class="hdr-txt"><tspan>조건 요약</tspan><tspan class="sort-icon-active"> ↑</tspan></text>
  <text x="620" y="226" class="hdr-txt"><tspan>상태</tspan><tspan class="sort-icon"> ↕</tspan></text>
  <text x="800" y="226" class="hdr-txt"><tspan>재검색</tspan><tspan class="sort-icon"> ↕</tspan></text>
  <rect class="row" x="288" y="236" width="864" height="32" id="row-1"/>
  <rect x="1060" y="244" width="56" height="18" rx="3" fill="#1976d2" id="btn-research-1"/>
  <rect class="row-hover-demo" x="288" y="268" width="864" height="32" id="row-2-hover-demo"/>
  <rect x="1060" y="276" width="56" height="18" rx="3" fill="#1976d2" id="btn-research-2"/>
  <rect class="row" x="288" y="300" width="864" height="32" id="row-3"/>
  <rect x="1060" y="308" width="56" height="18" rx="3" fill="#1976d2" id="btn-research-3"/>
  <rect class="row-alt" x="288" y="332" width="864" height="32" id="row-4"/>
  <rect x="1060" y="340" width="56" height="18" rx="3" fill="#1976d2" id="btn-research-4"/>
  <rect class="row" x="288" y="364" width="864" height="32" id="row-5"/>
  <rect x="1060" y="372" width="56" height="18" rx="3" fill="#1976d2" id="btn-research-5"/>
  <rect class="pg-paper" x="288" y="688" width="864" height="56" rx="4" id="pagination-bar-bg"/>
  <text x="304" y="722" class="pg-txt" id="pagination-summary">총 1,248건 / 1-25 표시</text>
  <line class="pg-divider" x1="558" y1="700" x2="558" y2="732" id="pagination-divider"/>
  <text x="574" y="722" class="pg-txt" id="pagination-size-label">페이지 크기</text>
  <rect class="pg-btn" x="640" y="706" width="56" height="24" rx="4" id="pagination-size-select"/>
  <text x="660" y="722" class="pg-btn-txt" id="pagination-size-value">25</text>
  <rect class="pg-disabled" x="726" y="706" width="28" height="24" rx="4" id="pagination-first-disabled"/>
  <text x="736" y="722" class="pg-disabled-txt">|&lt;</text>
  <rect class="pg-disabled" x="760" y="706" width="28" height="24" rx="4" id="pagination-prev-disabled"/>
  <text x="770" y="722" class="pg-disabled-txt">&lt;</text>
  <rect class="pg-active" x="794" y="706" width="28" height="24" rx="4" id="pagination-page-1-active"/>
  <text x="805" y="722" class="pg-active-txt">1</text>
  <rect class="pg-btn" x="828" y="706" width="28" height="24" rx="4" id="pagination-page-2"/>
  <text x="839" y="722" class="pg-btn-txt">2</text>
  <rect class="pg-btn" x="862" y="706" width="28" height="24" rx="4" id="pagination-page-3"/>
  <text x="873" y="722" class="pg-btn-txt">3</text>
  <rect class="pg-btn" x="896" y="706" width="28" height="24" rx="4" id="pagination-next"/>
  <text x="906" y="722" class="pg-btn-txt">&gt;</text>
  <rect class="pg-btn" x="930" y="706" width="28" height="24" rx="4" id="pagination-last"/>
  <text x="940" y="722" class="pg-btn-txt">&gt;|</text>
  <text x="978" y="722" class="pg-txt" id="pagination-page-info">1 / 50</text>
</svg>
