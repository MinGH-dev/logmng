<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Java FW Image Log search screen wireframe" data-step="java-fw-imagelog">
  <defs>
    <style>
      .view-title { fill: #212121; font-family: "Noto Sans KR", "Roboto", system-ui, sans-serif; font-size: 24px; font-weight: 600; }
      .bg { fill: #f5f5f5; }
      .side { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .bar { fill: #1976d2; }
      .bart { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 14px; }
      .navg { fill: #616161; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .nav { fill: #424242; font-family: system-ui, sans-serif; font-size: 12px; }
      .navhi { fill: #1976d2; font-weight: 600; }
      .paper { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .hdr-bg { fill: #fafafa; stroke: #e0e0e0; stroke-width: 1; }
      .hdr-txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
      .sort-icon { fill: #6c757d; font-size: 10px; }
      .sort-icon-active { fill: #1976d2; font-size: 11px; font-weight: 600; }
      .col-band { fill: #f6f8fb; }
      .col-band-alt { fill: #f1f4f8; }
      .row { fill: rgba(255, 255, 255, 0); stroke: #e3e8ef; stroke-width: 1; }
      .row-alt { fill: rgba(255, 255, 255, 0); stroke: #e3e8ef; stroke-width: 1; }
      .row-hover-demo { fill: #e8eef6; stroke: #e3e8ef; stroke-width: 1; }
      .hint { fill: #9e9e9e; font-family: system-ui, sans-serif; font-size: 11px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" id="shell-bg"/>
  <rect class="side" x="0" y="0" width="240" height="800" id="shell-sidebar"/>
  <text x="16" y="36" class="navg" id="nav-group-log">로그 검색</text>
  <text x="24" y="62" class="nav" id="nav-pb-feplog">PB FEP Log</text>
  <text x="24" y="88" class="nav navhi" id="nav-java-img">Java FW Image Log</text>
  <text x="16" y="124" class="navg" id="nav-group-history">이력·승인</text>
  <text x="24" y="150" class="nav" id="nav-activity">활동 이력</text>
  <text x="24" y="176" class="nav" id="nav-search-hist">검색 이력</text>
  <text x="24" y="202" class="nav" id="nav-pending">복호화 승인 관리</text>
  <rect class="bar" x="240" y="0" width="960" height="56" id="shell-appbar"/>
  <text x="260" y="36" class="bart" id="appbar-title">menu logmng</text>
  <rect class="paper" x="264" y="80" width="912" height="688" rx="4" id="content-panel"/>
  <text x="288" y="122" class="view-title" id="view-title">Java FW Image Log</text>
  <rect class="paper" x="288" y="140" width="864" height="52" rx="4" id="filter-area"/>
  <text x="300" y="172" class="hint" id="filter-hint">검색 조건 (이미지 로그)</text>
  <rect class="col-band" x="288" y="208" width="112" height="106" id="grid-col-time"/>
  <rect class="col-band-alt" x="400" y="208" width="320" height="106" id="grid-col-content"/>
  <rect class="col-band" x="720" y="208" width="432" height="106" id="grid-col-action"/>
  <rect class="hdr-bg" x="288" y="208" width="864" height="28" id="grid-header"/>
  <text x="296" y="226" class="hdr-txt"><tspan>시간</tspan><tspan class="sort-icon"> ↕</tspan></text>
  <text x="400" y="226" class="hdr-txt"><tspan>이미지/본문</tspan><tspan class="sort-icon-active"> ↑</tspan></text>
  <text x="720" y="226" class="hdr-txt"><tspan>작업</tspan><tspan class="sort-icon"> ↕</tspan></text>
  <rect class="row" x="288" y="236" width="864" height="26"/>
  <rect class="row-hover-demo" x="288" y="262" width="864" height="26"/>
  <rect class="row" x="288" y="288" width="864" height="26"/>
</svg>
