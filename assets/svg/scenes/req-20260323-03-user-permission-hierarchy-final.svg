    <text x="288" y="761" class="wf-meta-title" id="wireframe-visible-meta-title-req03" text-anchor="start">■ 와이어 주석 — 루트 data-* 요약 (이미지 뷰어 표시 · 제품 UI 문구 아님)</text>
    <text x="288" y="773" class="wf-meta-line" id="wireframe-visible-meta-l1-req03" text-anchor="start">루트 &lt;svg&gt; data-wireframe-* · data-col-screen-name-policy · data-ref = 해석 규칙 (에이전트·사람 공통).</text>
    <text x="288" y="785" class="wf-meta-line" id="wireframe-visible-meta-l2-req03" text-anchor="start">권한그룹 매트릭스: 행별 screenId·기능 = #screen-row-wire-legend-req02; 조회 범위 = #scope-wire-legend-req02.</text>
    <text x="288" y="797" class="wf-meta-line" id="wireframe-visible-meta-l3-req03" text-anchor="start">전문 규칙: .cursor/rules/svg-wireframe-semantics.mdc</text>
    <text x="288" y="809" class="wf-meta-line" id="wireframe-visible-meta-l4-req03" text-anchor="start">그 외 와이어(사용자 관리 등): 열별 주석은 동일하게 하단 슬랩 텍스트. 이 루트 data-* 요약도 data-wireframe-chrome으로 숨김.</text>
