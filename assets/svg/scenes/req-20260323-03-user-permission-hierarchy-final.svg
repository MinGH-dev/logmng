  <text x="288" y="427" class="wf-annotations-zone-title wf-chrome-annotations" id="wf-annotations-zone-hint-req03">와이어 주석 구역 (제품 화면 목업 아님)</text>
  <text x="288" y="451" class="wf-scope-legend-line wf-chrome-annotations" font-size="6.5px" id="fe-banner-wire-line">와이어 주석: 이 구역은 FE 라우팅·레이아웃 경고용. user-management / user-permission-hierarchy는 루트 data-frontend-note와 같이 동일 UserManagement 컴포넌트 렌더.</text>
  <text x="288" y="465" class="banner-title wf-chrome-annotations" id="fe-warn-title">프론트엔드 주의 (라우팅 · 에이전트 협란 방지)</text>
  <text x="288" y="481" class="banner-body wf-chrome-annotations" id="fe-warn-l1">사이드바에 「사용자 권한 계층」 메뉴 없음. 관리 → 사용자 관리가 유일 진입.</text>
  <text x="288" y="495" class="banner-body wf-chrome-annotations" id="fe-warn-l2">App.js: currentView 이 user-management 이든 user-permission-hierarchy 이든 동일하게 UserManagement 컴포넌트만 렌더.</text>
  <text x="288" y="509" class="banner-body wf-chrome-annotations" id="fe-warn-l3">UserPermissionHierarchy.js 는 저장소에 있으나 App에서 import 되지 않음. 별도 화면을 새로 만들지 말 것.</text>
  <line class="wf-section-divider wf-chrome-annotations" x1="288" y1="514" x2="1152" y2="514" aria-hidden="true" id="wf-section-divider-req03-s1"/>
  <text x="288" y="535" class="view-title wf-anno-text wf-chrome-annotations" id="view-title">TC-09 · user-permission-hierarchy (계약 화면 ID) / 실제 UI = 사용자 관리</text>
  <text x="288" y="557" class="hint wf-anno-text wf-chrome-annotations" id="view-hint">부서 트리: GET .../departments/user-permission-hierarchy?format=tree (이 화면에서 호출). 계층 API</text>
  <text x="288" y="571" class="hint wf-anno-text wf-chrome-annotations" id="view-hint-l2">응답·사용자 목록에서 isApprover 등 제거 대상 필드 없음.</text>
  <text x="288" y="589" class="meta wf-anno-text wf-chrome-annotations" id="uh-impl">구현 참조: frontend/src/components/UserManagement/UserManagement.js ·</text>
  <text x="288" y="602" class="meta wf-anno-text wf-chrome-annotations" id="uh-impl-l2">services/permissionGroupService.getUserPermissionHierarchy</text>
  <text x="288" y="617" class="meta wf-anno-text wf-chrome-annotations" id="uh-layout">아래 레이아웃은 req-20260323-01과 동일 단일 패널(부서 트리 + 그룹 열)이다. 오른쪽 별도 상세 패널은 없음.</text>
  <text x="288" y="636" class="meta wf-anno-text wf-chrome-annotations" id="tree-sec-label">부서 트리 (편치 후 사용자 행)</text>
  <text x="288" y="654" class="meta wf-anno-text wf-chrome-annotations" id="no-right-panel">→ 오른쪽 별도 상세 패널 없음 (UserManagement 단일 레이아웃)</text>
  <line class="wf-section-divider wf-chrome-annotations" x1="288" y1="655" x2="1152" y2="655" aria-hidden="true" id="wf-section-divider-req03-s2"/>
  <text x="288" y="676" class="warn-t wf-chrome-annotations" id="rm-box-heading">제거 대상 (응답 필드·UI)</text>
  <text x="288" y="694" class="node wf-chrome-annotations" id="rm-box-body">isApprover, 승인자 여부 단독 표시, decrypt_approver 연동 문구</text>
  <text x="288" y="712" class="node wf-chrome-annotations" id="tc9-line">TC-09: 계층 응답·목록에 decrypt_approver 전용 플래그 없음</text>
  <text x="288" y="730" class="meta wf-anno-text wf-chrome-annotations" id="tc09-api-foot">API: .../departments/user-permission-hierarchy · 사용자 목록 GET .../users (경로는 요약; SoT docs/contract.md 및 specs)</text>
  <line class="wf-chrome-meta wf-chrome-annotations wf-meta-separator" x1="288" y1="739" x2="1152" y2="739" stroke="#90a4ae" stroke-width="1" stroke-dasharray="6 4" aria-hidden="true"/>
  <g class="wf-chrome-meta wf-chrome-annotations wf-root-legend wireframe-root-legend" id="wireframe-visible-meta-req03" data-wf-layer="wire-annotations-root" role="region" aria-label="Wireframe annotations: root data-* summary; not product UI. Toggle data-wireframe-chrome">
