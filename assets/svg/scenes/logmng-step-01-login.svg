<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Login screen wireframe" data-step="login">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .card { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .login-brand { fill: #1976d2; font-family: "Noto Sans KR", "Roboto", system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .lbl { fill: #424242; font-family: system-ui, sans-serif; font-size: 12px; }
      .field { fill: #ffffff; stroke: #bdbdbd; stroke-width: 1; }
      .btn { fill: #1976d2; }
      .btnt { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" id="screen-login-bg"/>
  <rect class="card" x="400" y="220" width="400" height="360" rx="8" id="screen-login-card"/>
  <text x="600" y="280" text-anchor="middle" class="login-brand" id="screen-login-brand">logmng</text>
  <text x="430" y="330" class="lbl" id="label-userid">사용자 ID</text>
  <rect class="field" x="430" y="340" width="340" height="36" rx="4" id="input-userid"/>
  <text x="430" y="410" class="lbl" id="label-password">비밀번호</text>
  <rect class="field" x="430" y="420" width="340" height="36" rx="4" id="input-password"/>
  <rect class="btn" x="430" y="490" width="340" height="44" rx="4" id="btn-login"/>
  <text x="600" y="518" text-anchor="middle" class="btnt" id="btn-login-label">로그인</text>
</svg>
