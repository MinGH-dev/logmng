<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Common pagination scene" data-step="pagination-empty">
  <defs>
    <style>
      .view-title { fill: #212121; font-family: "Noto Sans KR", "Roboto", system-ui, sans-serif; font-size: 24px; font-weight: 600; }
      .bg { fill: #f5f5f5; }
      .side { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .bar { fill: #1976d2; }
      .bart { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 14px; }
      .paper { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .hint { fill: #9e9e9e; font-family: system-ui, sans-serif; font-size: 11px; }
      .hdr-bg { fill: #fafafa; stroke: #e0e0e0; stroke-width: 1; }
      .hdr-txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
      .row { fill: #ffffff; stroke: #eeeeee; stroke-width: 1; }
      .row-alt { fill: #fafafa; stroke: #eeeeee; stroke-width: 1; }
      .chip-ok { fill: #e8f5e9; stroke: #a5d6a7; stroke-width: 1; }
      .chip-err { fill: #ffebee; stroke: #ef9a9a; stroke-width: 1; }
      .chip-txt { fill: #424242; font-family: system-ui, sans-serif; font-size: 11px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" id="common-bg"/>
  <rect class="side" x="0" y="0" width="240" height="800" id="common-sidebar"/>
  <rect class="bar" x="240" y="0" width="960" height="56" id="common-appbar"/>
  <text x="260" y="36" class="bart" id="common-appbar-title">로그 관리 시스템</text>
  <rect class="paper" x="264" y="80" width="912" height="688" rx="4" id="common-content-panel"/>
  <text x="288" y="122" class="view-title" id="common-view-title">공통 페이징 화면 - 빈 목록</text>
  <rect class="paper" x="288" y="140" width="864" height="52" rx="4" id="common-filter-area"/>
  <text x="300" y="172" class="hint" id="common-filter-hint">필터 영역 (공통 컴포넌트)</text>
  <rect class="hdr-bg" x="288" y="208" width="864" height="28" id="common-table-header"/>
  <text x="296" y="226" class="hdr-txt">컬럼 A</text>
  <text x="430" y="226" class="hdr-txt">컬럼 B</text>
  <text x="640" y="226" class="hdr-txt">상태</text>
  <text x="840" y="226" class="hdr-txt">액션</text>
  <rect class="row" x="288" y="236" width="864" height="220" id="common-empty-box"/>
  <text x="620" y="350" text-anchor="middle" class="hint" id="common-empty-text">조건에 맞는 데이터가 없습니다.</text>
  <rect class="paper" x="288" y="688" width="864" height="56" rx="4" id="common-pagination-container"/>
  <text x="304" y="722" class="hint" id="common-pagination-summary">총 1,248건 / 1-25 표시</text>
  <rect class="paper" x="760" y="700" width="28" height="24" rx="4" id="common-page-prev"/>
  <text x="770" y="716" class="hdr-txt">&lt;</text>
  <rect x="794" y="700" width="28" height="24" rx="4" fill="#1976d2" id="common-page-1-active"/>
  <text x="805" y="716" style="fill:#ffffff;font-family:system-ui,sans-serif;font-size:11px;">1</text>
  <rect class="paper" x="828" y="700" width="28" height="24" rx="4" id="common-page-2"/>
  <text x="839" y="716" class="hdr-txt">2</text>
  <rect class="paper" x="862" y="700" width="28" height="24" rx="4" id="common-page-next"/>
  <text x="872" y="716" class="hdr-txt">&gt;</text>
</svg>
