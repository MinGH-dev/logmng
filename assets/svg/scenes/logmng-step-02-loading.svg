<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="전체 화면 로딩, 선형 진행 막대" data-step="loading">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .track { fill: #e0e0e0; }
      .fill { fill: #1976d2; opacity: 0.9; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" id="screen-loading-bg"/>
  <rect class="track" x="360" y="392" width="480" height="8" rx="4" id="screen-loading-bar-track"/>
  <rect class="fill" x="360" y="392" width="192" height="8" rx="4" id="screen-loading-bar-fill"/>
</svg>
