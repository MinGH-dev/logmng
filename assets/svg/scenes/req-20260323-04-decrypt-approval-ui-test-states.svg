<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1066" role="img" aria-label="Decrypt approval UI API test states" data-req="20260323-approver-eligibility" data-wireframe-semantics="v1" data-wireframe-rules-ref=".cursor/rules/svg-wireframe-semantics.mdc" data-wireframe-visible-meta="wireframe-visible-meta-req04" data-wireframe-chrome="full" data-ref="frontend/src/components/PendingApprovals/PendingApprovals.js" data-col-screen-name-policy="na-api-test-cards">
  <defs>
    <style>
      .title { fill: #212121; font-family: "Noto Sans KR", "Roboto", system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .sub { fill: #616161; font-family: system-ui, sans-serif; font-size: 12px; }
